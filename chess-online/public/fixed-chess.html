<!DOCTYPE html>
<html>
<head>
  <title>Fixed Chess Game</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #2c3e50; color: white; }
    .container { max-width: 800px; margin: 0 auto; }
    .lobby { background: #34495e; padding: 30px; border-radius: 8px; text-align: center; }
    .game { background: #34495e; padding: 20px; border-radius: 8px; display: none; }
    button { background: #3498db; color: white; border: none; padding: 15px 30px; margin: 10px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #2980b9; }
    button:disabled { background: #7f8c8d; cursor: not-allowed; }
    .board { margin: 20px auto; display: inline-block; }
    .status { background: #27ae60; padding: 15px; border-radius: 4px; margin: 10px 0; text-align: center; font-weight: bold; }
    .error { background: #e74c3c; }
    .loading { background: #f39c12; }
    .debug { background: #2c3e50; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>♟️ Fixed Chess Game</h1>
    
    <!-- Lobby -->
    <div class="lobby" id="lobby">
      <h2>Choose Game Mode</h2>
      <button id="whiteBtn" onclick="startGame('white')" disabled>Loading...</button>
      <button id="blackBtn" onclick="startGame('black')" disabled>Loading...</button>
      <div class="loading" id="loadingStatus">Loading chess libraries...</div>
    </div>
    
    <!-- Game -->
    <div class="game" id="game">
      <div class="status" id="status">Game starting...</div>
      <div class="board">
        <div id="board" style="width: 560px; height: 560px;"></div>
      </div>
      <button onclick="backToLobby()">Back to Lobby</button>
      <div class="debug" id="debug">Debug log will appear here...</div>
    </div>
  </div>

  <!-- Scripts with multiple fallbacks -->
  <script>
    function log(message) {
      const debug = document.getElementById('debug');
      const timestamp = new Date().toLocaleTimeString();
      if (debug) {
        debug.innerHTML = timestamp + ': ' + message + '<br>' + debug.innerHTML;
      }
      console.log(message);
    }
    
    function updateStatus(message, type = 'normal') {
      const status = document.getElementById('status');
      if (status) {
        status.textContent = message;
        status.className = 'status ' + (type === 'error' ? 'error' : type === 'loading' ? 'loading' : '');
      }
      log(message);
    }
    
    function enableButtons() {
      document.getElementById('whiteBtn').disabled = false;
      document.getElementById('blackBtn').disabled = false;
      document.getElementById('whiteBtn').textContent = 'Play as White';
      document.getElementById('blackBtn').textContent = 'Play as Black';
      document.getElementById('loadingStatus').style.display = 'none';
    }
    
    // Load jQuery
    log('Loading jQuery...');
    const jqueryScript = document.createElement('script');
    jqueryScript.src = 'https://code.jquery.com/jquery-3.6.0.min.js';
    jqueryScript.onload = function() {
      log('✅ jQuery loaded');
      loadChessBoard();
    };
    jqueryScript.onerror = function() {
      log('❌ jQuery failed, trying alternative...');
      jqueryScript.src = 'https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js';
    };
    document.head.appendChild(jqueryScript);
    
    // Load ChessBoard
    function loadChessBoard() {
      log('Loading ChessBoard...');
      const chessboardScript = document.createElement('script');
      chessboardScript.src = 'https://unpkg.com/chessboardjs@1.0.0/js/chessboard-1.0.0.min.js';
      chessboardScript.onload = function() {
        log('✅ ChessBoard loaded');
        loadChess();
      };
      chessboardScript.onerror = function() {
        log('❌ ChessBoard failed, trying alternative...');
        chessboardScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js';
      };
      document.head.appendChild(chessboardScript);
    }
    
    // Load Chess.js
    function loadChess() {
      log('Loading Chess.js...');
      const chessScript = document.createElement('script');
      chessScript.src = 'https://unpkg.com/chess.js@0.13.4/chess.min.js';
      chessScript.onload = function() {
        log('✅ Chess.js loaded');
        checkLibraries();
      };
      chessScript.onerror = function() {
        log('❌ Chess.js failed, trying alternative...');
        chessScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js';
      };
      document.head.appendChild(chessScript);
    }
    
    // Check all libraries are loaded
    function checkLibraries() {
      log('Checking libraries...');
      
      const checks = [
        { name: 'jQuery', test: () => typeof $ !== 'undefined' },
        { name: 'ChessBoard', test: () => typeof ChessBoard !== 'undefined' },
        { name: 'Chess', test: () => typeof Chess !== 'undefined' }
      ];
      
      let allLoaded = true;
      checks.forEach(({ name, test }) => {
        const loaded = test();
        log(name + ': ' + (loaded ? '✅' : '❌'));
        if (!loaded) allLoaded = false;
      });
      
      if (allLoaded) {
        log('🎉 All libraries loaded successfully!');
        enableButtons();
        updateStatus('Choose a game mode to start');
      } else {
        updateStatus('ERROR: Some libraries failed to load', 'error');
        log('❌ Library loading failed');
      }
    }
  </script>

  <script>
    let board = null;
    let chess = null;
    let playerColor = null;
    
    function startGame(color) {
      log('🎮 Starting game as ' + color);
      updateStatus('Starting game...', 'loading');
      
      try {
        // Check libraries again
        if (typeof Chess === 'undefined') {
          throw new Error('Chess.js is not loaded');
        }
        if (typeof ChessBoard === 'undefined') {
          throw new Error('ChessBoard.js is not loaded');
        }
        
        // Hide lobby, show game
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        
        // Set player color
        playerColor = color;
        
        // Create chess game
        chess = new Chess();
        log('✅ Chess game created: ' + chess.fen());
        updateStatus('Board created - You are playing as ' + color);
        
        // Create board
        const cfg = {
          draggable: true,
          position: chess.fen(),
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
          onDragStart: onDragStart,
          onDrop: onDrop,
          onSnapEnd: onSnapEnd
        };
        
        board = ChessBoard('board', cfg);
        log('✅ Board created successfully');
        
        // If player is black, CPU moves first
        if (color === 'black') {
          setTimeout(cpuMove, 1000);
        }
        
      } catch (error) {
        updateStatus('ERROR: ' + error.message, 'error');
        log('❌ ERROR: ' + error.message);
        console.error(error);
      }
    }
    
    function backToLobby() {
      log('🏠 Returning to lobby');
      document.getElementById('lobby').style.display = 'block';
      document.getElementById('game').style.display = 'none';
      if (board) {
        board.destroy();
        board = null;
      }
      chess = null;
      updateStatus('Choose a game mode to start');
    }
    
    function onDragStart(source, piece, position, orientation) {
      if (!chess || chess.game_over()) return false;
      
      // Only allow dragging player's pieces
      const pieceColor = piece.charAt(0) === 'w' ? 'w' : 'b';
      const playerPieceColor = playerColor === 'white' ? 'w' : 'b';
      
      if (pieceColor !== playerPieceColor) {
        updateStatus('You can only move your own pieces');
        return false;
      }
      
      return true;
    }
    
    function onDrop(source, target) {
      if (!chess) return 'snapback';
      
      try {
        const move = chess.move({
          from: source,
          to: target,
          promotion: 'q'
        });
        
        if (move === null) {
          updateStatus('Illegal move');
          return 'snapback';
        }
        
        board.position(chess.fen());
        updateStatus('You played: ' + move.san);
        log('✅ Move successful: ' + move.san);
        
        // Check game over
        if (chess.in_checkmate()) {
          const winner = chess.turn() === 'w' ? 'Black' : 'White';
          updateStatus('🏆 CHECKMATE! ' + winner + ' wins!');
          log('🏆 CHECKMATE: ' + winner + ' wins');
        } else if (chess.in_draw()) {
          updateStatus('🤝 Draw!');
          log('🤝 Draw');
        } else if (chess.in_check()) {
          updateStatus('⚠️ Check!');
          log('⚠️ Check');
        }
        
        // CPU move
        setTimeout(cpuMove, 1000);
        
      } catch (error) {
        updateStatus('Move error: ' + error.message, 'error');
        log('❌ Move error: ' + error.message);
        return 'snapback';
      }
    }
    
    function onSnapEnd() {
      if (board && chess) {
        board.position(chess.fen());
      }
    }
    
    function cpuMove() {
      if (!chess || chess.game_over()) return;
      
      const moves = chess.moves({ verbose: true });
      if (moves.length === 0) {
        log('No CPU moves available');
        return;
      }
      
      log('🤖 CPU is thinking...');
      
      // Make random move
      const randomMove = moves[Math.floor(Math.random() * moves.length)];
      const move = chess.move(randomMove);
      
      if (move) {
        board.position(chess.fen());
        updateStatus('CPU played: ' + move.san);
        log('✅ CPU move: ' + move.san);
        
        // Check game over
        if (chess.in_checkmate()) {
          const winner = chess.turn() === 'w' ? 'Black' : 'White';
          updateStatus('🏆 CHECKMATE! ' + winner + ' wins!');
          log('🏆 CHECKMATE: ' + winner + ' wins');
        } else if (chess.in_draw()) {
          updateStatus('🤝 Draw!');
          log('🤝 Draw');
        } else if (chess.in_check()) {
          updateStatus('⚠️ Check!');
          log('⚠️ Check');
        } else {
          const turn = chess.turn() === 'w' ? 'White' : 'Black';
          const playerTurn = playerColor === 'white' ? 'White' : 'Black';
          if (turn === playerTurn) {
            updateStatus('Your turn');
          }
        }
      } else {
        log('❌ CPU move failed');
      }
    }
    
    // Initialize
    log('🚀 Fixed chess game loading...');
  </script>
</body>
</html>
