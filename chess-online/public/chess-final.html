<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master Pro - Final Working Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .game-modes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .difficulty {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .diff-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .diff-btn:hover {
            background: #38a169;
        }

        .diff-btn.active {
            background: #2d3748;
        }

        .game-area {
            display: none;
            text-align: center;
        }

        .game-area.active {
            display: block;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .white-avatar {
            background: white;
            border: 2px solid #333;
        }

        .black-avatar {
            background: #333;
            color: white;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: #edf2f7;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }

        .board {
            display: inline-block;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .control-btn:hover {
            background: #5a67d8;
        }

        .menu-btn {
            background: #e53e3e;
        }

        .menu-btn:hover {
            background: #c53030;
        }

        .debug {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-width: 300px;
            z-index: 10000;
        }

        .loading {
            text-align: center;
            padding: 20px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="debug" id="debug">Loading...</div>
        
        <div class="loading" id="loading">
            Loading chess libraries...
        </div>

        <div class="header">
            <h1 class="title">♟️ Chess Master Pro</h1>
            <p>Choose your game mode to start playing</p>
        </div>

        <!-- Game Mode Selection -->
        <div id="modeSelection" style="display: none;">
            <div class="game-modes">
                <button class="mode-btn" onclick="selectMode('ai')">🤖 Play vs Computer</button>
                <button class="mode-btn" onclick="selectMode('friend')">👥 Play vs Friend</button>
            </div>

            <div class="difficulty" id="difficulty">
                <button class="diff-btn active" onclick="setDifficulty('easy')">Easy</button>
                <button class="diff-btn" onclick="setDifficulty('medium')">Medium</button>
                <button class="diff-btn" onclick="setDifficulty('hard')">Hard</button>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area" id="gameArea">
            <div class="game-info">
                <div class="player">
                    <div class="player-avatar white-avatar">♔</div>
                    <div>
                        <div><strong>White</strong></div>
                        <div id="whiteStatus">Your turn</div>
                    </div>
                </div>
                <div class="player">
                    <div class="player-avatar black-avatar">♚</div>
                    <div>
                        <div><strong>Black</strong></div>
                        <div id="blackStatus">Computer</div>
                    </div>
                </div>
            </div>

            <div class="status" id="gameStatus">Game in progress</div>

            <div class="board">
                <div id="board" style="width: 400px; height: 400px;"></div>
            </div>

            <div class="controls">
                <button class="control-btn" onclick="undoMove()">↶ Undo</button>
                <button class="control-btn" onclick="resetGame()">🔄 Reset</button>
                <button class="control-btn menu-btn" onclick="backToMenu()">🏠 Menu</button>
            </div>
        </div>
    </div>

    <!-- Scripts with error handling -->
    <script>
        // Global variables
        let board = null;
        let chess = null;
        let gameMode = null;
        let difficulty = 'easy';
        let playerColor = 'white';
        let moveHistory = [];
        let librariesLoaded = false;

        function updateDebug(message) {
            document.getElementById('debug').innerHTML = message;
            console.log(message);
        }

        function updateStatus(message) {
            document.getElementById('gameStatus').textContent = message;
            updateDebug('Status: ' + message);
        }

        // Load libraries with error handling
        function loadLibraries() {
            updateDebug('Loading jQuery...');
            
            // Load jQuery
            const jquery = document.createElement('script');
            jquery.src = 'https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js';
            jquery.onload = function() {
                updateDebug('jQuery loaded. Loading ChessBoard...');
                
                // Load ChessBoard
                const chessboard = document.createElement('script');
                chessboard.src = 'https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js';
                chessboard.onload = function() {
                    updateDebug('ChessBoard loaded. Loading Chess.js...');
                    
                    // Load Chess.js
                    const chessjs = document.createElement('script');
                    chessjs.src = 'https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js';
                    chessjs.onload = function() {
                        updateDebug('All libraries loaded!');
                        librariesLoaded = true;
                        initializeApp();
                    };
                    chessjs.onerror = function() {
                        updateDebug('Error loading Chess.js');
                        updateStatus('Error loading chess library');
                    };
                    document.head.appendChild(chessjs);
                };
                chessboard.onerror = function() {
                    updateDebug('Error loading ChessBoard');
                    updateStatus('Error loading chess board library');
                };
                document.head.appendChild(chessboard);
            };
            jquery.onerror = function() {
                updateDebug('Error loading jQuery');
                updateStatus('Error loading jQuery library');
            };
            document.head.appendChild(jquery);
        }

        function initializeApp() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('modeSelection').style.display = 'block';
            updateStatus('Choose a game mode to start');
            updateDebug('App initialized. Ready to play!');
        }

        function selectMode(mode) {
            if (!librariesLoaded) {
                updateStatus('Libraries still loading...');
                return;
            }
            
            gameMode = mode;
            updateDebug('Selected mode: ' + mode);

            if (mode === 'ai') {
                document.getElementById('difficulty').style.display = 'flex';
                updateStatus('Select difficulty level');
            } else {
                document.getElementById('difficulty').style.display = 'none';
                startGame('friend');
            }
        }

        function setDifficulty(level) {
            difficulty = level;
            updateDebug('Difficulty set to: ' + level);
            
            // Update button states
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            startGame('ai');
        }

        function startGame(mode) {
            if (!librariesLoaded) {
                updateStatus('Libraries still loading...');
                return;
            }
            
            updateDebug('Starting game: ' + mode);
            
            // Hide mode selection, show game
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('gameArea').classList.add('active');

            // Set player info
            if (mode === 'ai') {
                playerColor = 'white';
                document.getElementById('whiteStatus').textContent = 'Your turn';
                document.getElementById('blackStatus').textContent = 'Computer';
            } else {
                playerColor = 'white';
                document.getElementById('whiteStatus').textContent = 'Player 1';
                document.getElementById('blackStatus').textContent = 'Player 2';
            }

            initializeGame();
        }

        function initializeGame() {
            updateDebug('Initializing chess game');
            
            try {
                // Check if Chess is available
                if (typeof Chess === 'undefined') {
                    updateDebug('Chess.js not loaded yet');
                    updateStatus('Chess library not loaded');
                    return;
                }
                
                // Create chess game
                chess = new Chess();
                moveHistory = [];
                updateDebug('Chess game created');

                // Create board configuration
                const cfg = {
                    draggable: true,
                    position: chess.fen(),
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                    onDragStart: onDragStart,
                    onDrop: onDrop,
                    onSnapEnd: onSnapEnd
                };

                // Destroy existing board if it exists
                if (board) {
                    board.destroy();
                }

                // Create new board
                board = ChessBoard('board', cfg);
                updateDebug('Chess board created');
                
                updateStatus('Game started! Make your move');
                
            } catch (error) {
                updateDebug('Error initializing game: ' + error.message);
                updateStatus('ERROR: ' + error.message);
            }
        }

        function onDragStart(source, piece, position, orientation) {
            updateDebug('Drag start: ' + source + ' ' + piece);
            
            if (!chess || chess.game_over()) {
                updateDebug('Game over or no chess object');
                return false;
            }

            // In AI mode, only allow dragging player's pieces
            if (gameMode === 'ai') {
                const pieceColor = piece.charAt(0) === 'w' ? 'w' : 'b';
                const playerPieceColor = playerColor === 'white' ? 'w' : 'b';
                const currentTurn = chess.turn();
                
                updateDebug('Piece color: ' + pieceColor + ' Player color: ' + playerPieceColor + ' Current turn: ' + currentTurn);
                
                if (pieceColor !== playerPieceColor || currentTurn !== playerPieceColor) {
                    updateDebug('Cannot move this piece');
                    return false;
                }
            }

            return true;
        }

        function onDrop(source, target) {
            updateDebug('Drop: ' + source + ' to ' + target);
            
            if (!chess) {
                updateDebug('No chess object');
                return 'snapback';
            }

            try {
                const move = chess.move({
                    from: source,
                    to: target,
                    promotion: 'q'
                });

                updateDebug('Move result: ' + JSON.stringify(move));

                if (move === null) {
                    updateDebug('Illegal move');
                    updateStatus('Illegal move! Try again');
                    return 'snapback';
                }

                moveHistory.push(move);
                board.position(chess.fen());
                updateStatus('You played: ' + move.san);

                // Check game over
                if (chess.in_checkmate()) {
                    const winner = chess.turn() === 'w' ? 'Black' : 'White';
                    updateStatus('CHECKMATE! ' + winner + ' wins!');
                    return;
                } else if (chess.in_draw()) {
                    updateStatus('Draw!');
                    return;
                } else if (chess.in_check()) {
                    updateStatus('Check!');
                }

                // AI move in AI mode
                if (gameMode === 'ai' && !chess.game_over()) {
                    updateStatus('Computer is thinking...');
                    setTimeout(makeAIMove, 1000);
                } else {
                    updateTurnStatus();
                }

            } catch (error) {
                updateDebug('Move error: ' + error.message);
                updateStatus('Move error: ' + error.message);
                return 'snapback';
            }
        }

        function onSnapEnd() {
            if (board && chess) {
                board.position(chess.fen());
            }
        }

        function makeAIMove() {
            updateDebug('Making AI move');
            
            if (!chess || chess.game_over()) {
                updateDebug('Game over or no chess object');
                return;
            }

            const moves = chess.moves({ verbose: true });
            updateDebug('Available moves: ' + moves.length);
            
            if (moves.length === 0) {
                updateDebug('No moves available');
                return;
            }

            let selectedMove = moves[Math.floor(Math.random() * moves.length)];
            updateDebug('AI selected move: ' + JSON.stringify(selectedMove));

            const move = chess.move(selectedMove);
            
            if (move) {
                moveHistory.push(move);
                board.position(chess.fen());
                updateStatus('Computer played: ' + move.san);

                // Check game over
                if (chess.in_checkmate()) {
                    updateStatus('CHECKMATE! Computer wins!');
                } else if (chess.in_draw()) {
                    updateStatus('Draw!');
                } else if (chess.in_check()) {
                    updateStatus('Check! Your turn');
                } else {
                    updateStatus('Your turn');
                }
            } else {
                updateDebug('AI move failed');
            }
        }

        function updateTurnStatus() {
            const turn = chess.turn();
            if (gameMode === 'friend') {
                if (turn === 'w') {
                    document.getElementById('whiteStatus').textContent = 'Player 1\'s turn';
                    document.getElementById('blackStatus').textContent = 'Player 2';
                } else {
                    document.getElementById('whiteStatus').textContent = 'Player 1';
                    document.getElementById('blackStatus').textContent = 'Player 2\'s turn';
                }
            }
        }

        function undoMove() {
            if (moveHistory.length >= 2) {
                chess.undo();
                chess.undo();
                board.position(chess.fen());
                moveHistory.pop();
                moveHistory.pop();
                updateStatus('Move undone');
            }
        }

        function resetGame() {
            if (chess) {
                chess.reset();
                moveHistory = [];
            }
            if (board) {
                board.position(chess.fen());
            }
            updateStatus('Game reset');
        }

        function backToMenu() {
            document.getElementById('modeSelection').style.display = 'block';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('difficulty').style.display = 'none';
            resetGame();
            updateStatus('Choose a game mode to start');
        }

        // Start loading libraries when page loads
        window.onload = function() {
            updateDebug('Page loaded. Starting library loading...');
            loadLibraries();
        };
    </script>
</body>
</html>
