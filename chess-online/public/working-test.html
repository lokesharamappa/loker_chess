<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working Chess Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #2c3e50;
      color: white;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #34495e;
      padding: 20px;
      border-radius: 8px;
    }
    .board-wrapper {
      display: inline-block;
      margin: 20px 0;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
      font-size: 16px;
    }
    button:hover {
      background: #2980b9;
    }
    .status {
      background: #27ae60;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
      font-weight: bold;
    }
    .error {
      background: #e74c3c;
    }
    .debug {
      background: #2c3e50;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Chess Board Working Test</h1>
    
    <div class="status" id="status">Initializing test environment...</div>
    
    <div>
      <button onclick="testDependencies()">Test Dependencies</button>
      <button onclick="createBoard()">Create Board</button>
      <button onclick="startCPUWhite()">Play vs CPU (White)</button>
      <button onclick="startCPUBlack()">Play vs CPU (Black)</button>
      <button onclick="makeRandomMove()">Test Random Move</button>
    </div>
    
    <div class="board-wrapper">
      <div id="board" style="width: 560px; height: 560px;"></div>
    </div>
    
    <div class="debug" id="debug">Debug log will appear here...</div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>
  <script src="./test-automation.js"></script>

  <script>
    let board = null;
    let chess = null;
    let gameMode = null;
    let humanColor = null;
    let cpuColor = null;

    function log(message) {
      const debugEl = document.getElementById('debug');
      debugEl.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
      debugEl.scrollTop = debugEl.scrollHeight;
      console.log(message);
    }

    function updateStatus(message, isError = false) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
      log(message);
    }

    function testDependencies() {
      log('Testing dependencies...');
      
      const tests = [
        { name: 'jQuery', test: () => typeof $ !== 'undefined' },
        { name: 'Chess.js', test: () => typeof window.Chess === 'function' },
        { name: 'ChessBoard.js', test: () => typeof window.ChessBoard === 'function' },
        { name: 'Board element', test: () => document.getElementById('board') !== null }
      ];
      
      let allPassed = true;
      tests.forEach(({ name, test }) => {
        const passed = test();
        log(`${name}: ${passed ? '✅ PASS' : '❌ FAIL'}`);
        if (!passed) allPassed = false;
      });
      
      updateStatus(allPassed ? 'All dependencies loaded!' : 'Some dependencies missing!', !allPassed);
      return allPassed;
    }

    function createBoard() {
      log('Creating chess board...');
      
      try {
        if (!testDependencies()) {
          throw new Error('Dependencies not ready');
        }
        
        // Create chess game
        chess = new window.Chess();
        log('Chess game created. FEN: ' + chess.fen());
        
        // Create board configuration
        const cfg = {
          draggable: true,
          position: chess.fen(),
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
          onDragStart: onDragStart,
          onDrop: onDrop,
          onSnapEnd: onSnapEnd,
          onMouseoutSquare: onMouseoutSquare,
          onMouseoverSquare: onMouseoverSquare,
          onChange: onChange
        };
        
        // Destroy existing board if any
        if (board) {
          board.destroy();
          log('Destroyed existing board');
        }
        
        // Create new board
        const boardEl = document.getElementById('board');
        board = window.ChessBoard(boardEl, cfg);
        
        // Apply styling
        boardEl.style.borderRadius = '4px';
        boardEl.style.overflow = 'hidden';
        boardEl.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.3)';
        
        updateStatus('Board created successfully! Ready to play.');
        log('Board created with configuration: ' + JSON.stringify(cfg, null, 2));
        
      } catch (error) {
        updateStatus('Error creating board: ' + error.message, true);
        log('ERROR: ' + error.stack);
      }
    }

    function startCPUWhite() {
      log('Starting CPU game - Human plays White');
      
      if (!board || !chess) {
        updateStatus('Please create board first!', true);
        return;
      }
      
      gameMode = 'cpu';
      humanColor = 'w';
      cpuColor = 'b';
      
      // Reset game
      chess.reset();
      board.position(chess.fen());
      
      updateStatus('CPU game started! You are White, CPU is Black.');
      log('Game mode: CPU, Human: White, CPU: Black');
    }

    function startCPUBlack() {
      log('Starting CPU game - Human plays Black');
      
      if (!board || !chess) {
        updateStatus('Please create board first!', true);
        return;
      }
      
      gameMode = 'cpu';
      humanColor = 'b';
      cpuColor = 'w';
      
      // Reset game
      chess.reset();
      board.position(chess.fen());
      
      updateStatus('CPU game started! You are Black, CPU is White.');
      log('Game mode: CPU, Human: Black, CPU: White');
      
      // CPU moves first
      setTimeout(makeCPUMove, 1000);
    }

    function makeCPUMove() {
      if (!chess || gameMode !== 'cpu' || chess.turn() !== cpuColor) {
        log('CPU move not needed - not CPU turn');
        return;
      }
      
      log('CPU is thinking...');
      
      try {
        const moves = chess.moves({ verbose: true });
        log('CPU has ' + moves.length + ' available moves');
        
        if (moves.length === 0) {
          updateStatus('No CPU moves available - Game over?', true);
          return;
        }
        
        // Make a random move for testing
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        log('CPU selected move: ' + JSON.stringify(randomMove));
        
        const move = chess.move(randomMove);
        
        if (move) {
          board.position(chess.fen());
          updateStatus('CPU played: ' + move.san);
          log('CPU move successful: ' + move.san + '. New FEN: ' + chess.fen());
          
          checkGameOver();
        } else {
          updateStatus('CPU move failed!', true);
          log('ERROR: CPU move failed for ' + JSON.stringify(randomMove));
        }
        
      } catch (error) {
        updateStatus('Error making CPU move: ' + error.message, true);
        log('CPU ERROR: ' + error.stack);
      }
    }

    function makeRandomMove() {
      if (!chess) {
        updateStatus('Please create board first!', true);
        return;
      }
      
      try {
        const moves = chess.moves({ verbose: true });
        if (moves.length === 0) {
          updateStatus('No moves available', true);
          return;
        }
        
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        const move = chess.move(randomMove);
        
        if (move) {
          board.position(chess.fen());
          updateStatus('Test move: ' + move.san);
          log('Test move successful: ' + move.san);
          
          checkGameOver();
          
          // Trigger CPU move if needed
          if (gameMode === 'cpu' && cpuColor === chess.turn()) {
            setTimeout(makeCPUMove, 1000);
          }
        }
        
      } catch (error) {
        updateStatus('Error making test move: ' + error.message, true);
        log('MOVE ERROR: ' + error.stack);
      }
    }

    function checkGameOver() {
      if (!chess) return;
      
      if (chess.in_checkmate()) {
        const winner = chess.turn() === 'w' ? 'Black' : 'White';
        updateStatus('🎉 CHECKMATE! ' + winner + ' wins!');
        log('GAME OVER: Checkmate - ' + winner + ' wins');
      } else if (chess.in_draw()) {
        updateStatus('🤝 Draw!');
        log('GAME OVER: Draw');
      } else if (chess.in_stalemate()) {
        updateStatus('🤝 Stalemate!');
        log('GAME OVER: Stalemate');
      } else if (chess.in_check()) {
        updateStatus('⚠️ Check!');
        log('Check detected');
      }
    }

    // Chess board event handlers
    function onDragStart(source, piece, position, orientation) {
      log('Drag start: ' + source + ' ' + piece);
      
      if (!chess) return false;
      
      // Don't allow drag if game is over
      if (chess.game_over()) {
        log('Game over - drag not allowed');
        return false;
      }
      
      // Only allow drag for human's pieces in CPU mode
      if (gameMode === 'cpu' && humanColor) {
        const pieceColor = piece.charAt(0) === 'w' ? 'w' : 'b';
        if (pieceColor !== humanColor) {
          log('Not human piece - drag not allowed');
          return false;
        }
      }
      
      return true;
    }

    function onDrop(source, target) {
      log('Drop: ' + source + ' -> ' + target);
      
      if (!chess) {
        log('No chess object - snapback');
        return 'snapback';
      }
      
      try {
        const move = chess.move({
          from: source,
          to: target,
          promotion: 'q'
        });
        
        if (move === null) {
          log('Illegal move - snapback');
          return 'snapback';
        }
        
        updateStatus('Move played: ' + move.san);
        log('Move successful: ' + move.san + '. FEN: ' + chess.fen());
        
        checkGameOver();
        
        // Trigger CPU move if needed
        if (gameMode === 'cpu' && cpuColor === chess.turn()) {
          setTimeout(makeCPUMove, 1000);
        }
        
      } catch (error) {
        updateStatus('Error making move: ' + error.message, true);
        log('MOVE ERROR: ' + error.stack);
        return 'snapback';
      }
    }

    function onSnapEnd() {
      if (board && chess) {
        board.position(chess.fen());
        log('Board position updated');
      }
    }

    function onMouseoutSquare(square, piece) {
      // Remove highlights
    }

    function onMouseoverSquare(square, piece) {
      // Add highlights
    }

    function onChange(oldPos, newPos) {
      log('Position changed');
    }

    // Initialize on page load
    window.addEventListener('load', function() {
      log('Page loaded successfully');
      updateStatus('Ready! Click "Test Dependencies" to begin.');
    });
  </script>
</body>
</html>
