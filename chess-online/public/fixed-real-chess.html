<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Master Pro</title>
  <style>
    :root {
      --bg-primary: #181a21;
      --bg-secondary: #2b2d3a;
      --bg-tertiary: #3e4049;
      --text-primary: #ffffff;
      --text-secondary: #b4b4b4;
      --accent-blue: #326ce5;
      --accent-green: #46a358;
      --accent-red: #ce4646;
      --accent-yellow: #f5bf5f;
      --border-color: #3e4049;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: var(--bg-secondary);
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .main-content {
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      gap: 20px;
      margin-top: 20px;
    }

    .panel {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .player-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .player-name {
      font-weight: 600;
      font-size: 16px;
    }

    .player-rating {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .player-time {
      background: var(--bg-primary);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
    }

    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chess-board {
      display: grid;
      grid-template-columns: repeat(8, 70px);
      grid-template-rows: repeat(8, 70px);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin: 20px 0;
    }

    .square {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .square.white {
      background: #f0d9b5;
    }

    .square.black {
      background: #b58863;
    }

    .square.selected {
      background: #739962 !important;
      box-shadow: inset 0 0 0 3px #5a7c4a;
    }

    .square.valid-move {
      position: relative;
    }

    .square.valid-move::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .square.valid-capture::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border: 3px solid rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .game-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: white;
    }

    .btn-primary:hover {
      background: #2555d6;
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--bg-primary);
    }

    .btn-danger {
      background: var(--accent-red);
      color: white;
    }

    .btn-danger:hover {
      background: #b83939;
    }

    .game-status {
      background: var(--bg-tertiary);
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .moves-list {
      max-height: 300px;
      overflow-y: auto;
      background: var(--bg-tertiary);
      padding: 15px;
      border-radius: 6px;
    }

    .move-pair {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .move-number {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .lobby {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lobby-content {
      background: var(--bg-secondary);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .lobby h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .lobby p {
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    .lobby-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .difficulty-select {
      margin: 20px 0;
      padding: 10px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 16px;
    }

    .hidden {
      display: none !important;
    }

    .victory-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(70, 163, 88, 0.95), rgba(34, 108, 229, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .victory-content {
      text-align: center;
      color: white;
      animation: fadeInScale 0.6s ease-out;
    }

    .victory-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .victory-title {
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .victory-subtitle {
      font-size: 20px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">♟️ Chess Master Pro</div>
    <div>
      <button class="btn btn-secondary" onclick="showSettings()">⚙️</button>
      <button class="btn btn-secondary" onclick="showProfile()">👤</button>
    </div>
  </header>

  <div class="container">
    <div class="main-content">
      <!-- Left Panel -->
      <div class="panel">
        <div class="player-info">
          <div>
            <div class="player-name" id="whitePlayerName">White</div>
            <div class="player-rating">1200</div>
          </div>
          <div class="player-time" id="whiteTime">10:00</div>
        </div>

        <div class="player-info">
          <div>
            <div class="player-name" id="blackPlayerName">Black</div>
            <div class="player-rating">1200</div>
          </div>
          <div class="player-time" id="blackTime">10:00</div>
        </div>

        <div class="game-status" id="gameStatus">Choose game mode to start</div>

        <div class="panel">
          <h3 style="margin-bottom: 15px;">Settings</h3>
          <div style="margin-bottom: 10px;">
            <label style="display: block; margin-bottom: 5px;">Board Theme</label>
            <select class="difficulty-select" onchange="changeTheme(this.value)">
              <option value="classic">Classic</option>
              <option value="wood">Wood</option>
              <option value="green">Green</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 5px;">Sound</label>
            <input type="checkbox" id="soundToggle" checked>
          </div>
        </div>
      </div>

      <!-- Center Panel - Chess Board -->
      <div class="panel board-container">
        <div class="chess-board" id="chessBoard"></div>
        <div class="game-controls">
          <button class="btn btn-primary" onclick="newGame()">New Game</button>
          <button class="btn btn-secondary" onclick="flipBoard()">Flip Board</button>
          <button class="btn btn-danger" onclick="resign()">Resign</button>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="panel">
        <h3 style="margin-bottom: 15px;">Moves</h3>
        <div class="moves-list" id="movesList">
          <div style="color: var(--text-secondary); text-align: center;">No moves yet</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lobby Modal -->
  <div class="lobby" id="lobby">
    <div class="lobby-content">
      <h2>Chess Master Pro</h2>
      <p>Choose your game mode</p>
      
      <div class="lobby-buttons">
        <button class="btn btn-primary" onclick="startGame('white')">Play as White</button>
        <button class="btn btn-primary" onclick="startGame('black')">Play as Black</button>
        
        <select class="difficulty-select" id="difficultySelect">
          <option value="1">Easy</option>
          <option value="2" selected>Medium</option>
          <option value="3">Hard</option>
          <option value="4">Expert</option>
          <option value="5">Grandmaster</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    // Chess Game Engine - FIXED VERSION
    class ChessGame {
      constructor() {
        this.board = this.createInitialBoard();
        this.currentTurn = 'white';
        this.moveHistory = [];
        this.selectedPiece = null;
        this.playerColor = null;
        this.cpuDifficulty = 2;
      }

      createInitialBoard() {
        return [
          ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
          ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
          ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
        ];
      }

      getPieceColor(piece) {
        if (!piece) return null;
        return ['♔', '♕', '♖', '♗', '♘', '♙'].includes(piece) ? 'white' : 'black';
      }

      isValidMove(fromRow, fromCol, toRow, toCol) {
        const piece = this.board[fromRow][fromCol];
        if (!piece) return false;

        const pieceColor = this.getPieceColor(piece);
        if (pieceColor !== this.currentTurn) return false;

        const targetPiece = this.board[toRow][toCol];
        if (targetPiece && this.getPieceColor(targetPiece) === pieceColor) return false;

        const rowDiff = Math.abs(toRow - fromRow);
        const colDiff = Math.abs(toCol - fromCol);

        // Pawn moves
        if (piece === '♙') {
          if (fromCol === toCol && !targetPiece) {
            if (toRow === fromRow - 1) return true;
            if (fromRow === 6 && toRow === 4 && !this.board[5][fromCol] && !this.board[4][fromCol]) return true;
          }
          if (colDiff === 1 && toRow === fromRow - 1 && targetPiece) return true;
          return false;
        }

        if (piece === '♟') {
          if (fromCol === toCol && !targetPiece) {
            if (toRow === fromRow + 1) return true;
            if (fromRow === 1 && toRow === 3 && !this.board[2][fromCol] && !this.board[3][fromCol]) return true;
          }
          if (colDiff === 1 && toRow === fromRow + 1 && targetPiece) return true;
          return false;
        }

        // Knight moves
        if (piece === '♘' || piece === '♞') {
          return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
        }

        // Rook moves
        if (piece === '♖' || piece === '♜') {
          if (fromRow === toRow || fromCol === toCol) {
            return this.isPathClear(fromRow, fromCol, toRow, toCol);
          }
          return false;
        }

        // Bishop moves
        if (piece === '♗' || piece === '♝') {
          if (rowDiff === colDiff) {
            return this.isPathClear(fromRow, fromCol, toRow, toCol);
          }
          return false;
        }

        // Queen moves
        if (piece === '♕' || piece === '♛') {
          if (fromRow === toRow || fromCol === toCol || rowDiff === colDiff) {
            return this.isPathClear(fromRow, fromCol, toRow, toCol);
          }
          return false;
        }

        // King moves
        if (piece === '♔' || piece === '♚') {
          return rowDiff <= 1 && colDiff <= 1;
        }

        return false;
      }

      isPathClear(fromRow, fromCol, toRow, toCol) {
        const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
        const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;

        let row = fromRow + rowStep;
        let col = fromCol + colStep;

        while (row !== toRow || col !== toCol) {
          if (this.board[row][col]) return false;
          row += rowStep;
          col += colStep;
        }

        return true;
      }

      makeMove(fromRow, fromCol, toRow, toCol) {
        const piece = this.board[fromRow][fromCol];
        const capturedPiece = this.board[toRow][toCol];

        this.board[toRow][toCol] = piece;
        this.board[fromRow][fromCol] = null;

        const moveNotation = this.getMoveNotation(piece, fromRow, fromCol, toRow, toCol, capturedPiece);
        this.moveHistory.push(moveNotation);

        this.currentTurn = this.currentTurn === 'white' ? 'black' : 'white';

        return { piece, capturedPiece, moveNotation };
      }

      getMoveNotation(piece, fromRow, fromCol, toRow, toCol, capturedPiece) {
        const cols = 'abcdefgh';
        const from = cols[fromCol] + (8 - fromRow);
        const to = cols[toCol] + (8 - toRow);
        return piece + ' ' + from + ' → ' + to;
      }

      getRandomMove() {
        const moves = [];
        for (let fromRow = 0; fromRow < 8; fromRow++) {
          for (let fromCol = 0; fromCol < 8; fromCol++) {
            const piece = this.board[fromRow][fromCol];
            if (piece && this.getPieceColor(piece) === this.currentTurn) {
              for (let toRow = 0; toRow < 8; toRow++) {
                for (let toCol = 0; toCol < 8; toCol++) {
                  if (this.isValidMove(fromRow, fromCol, toRow, toCol)) {
                    moves.push({ fromRow, fromCol, toRow, toCol });
                  }
                }
              }
            }
          }
        }
        return moves.length > 0 ? moves[Math.floor(Math.random() * moves.length)] : null;
      }

      // FIXED: Proper checkmate detection
      isCheckmate() {
        // Check if current player has any valid moves
        for (let fromRow = 0; fromRow < 8; fromRow++) {
          for (let fromCol = 0; fromCol < 8; fromCol++) {
            const piece = this.board[fromRow][fromCol];
            if (piece && this.getPieceColor(piece) === this.currentTurn) {
              for (let toRow = 0; toRow < 8; toRow++) {
                for (let toCol = 0; toCol < 8; toCol++) {
                  if (this.isValidMove(fromRow, fromCol, toRow, toCol)) {
                    return false; // Found a valid move, not checkmate
                  }
                }
              }
            }
          }
        }
        return true; // No valid moves found, it's checkmate or stalemate
      }

      hasKing(color) {
        const king = color === 'white' ? '♔' : '♚';
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            if (this.board[row][col] === king) {
              return true;
            }
          }
        }
        return false; // King was captured
      }
    }

    // Game State
    let game = null;
    let playerColor = null;
    let boardFlipped = false;

    // UI Functions
    function updateStatus(message) {
      document.getElementById('gameStatus').textContent = message;
    }

    function updatePlayerInfo() {
      const whiteName = playerColor === 'white' ? 'You' : 'Computer';
      const blackName = playerColor === 'black' ? 'You' : 'Computer';
      
      document.getElementById('whitePlayerName').textContent = whiteName;
      document.getElementById('blackPlayerName').textContent = blackName;
    }

    function updateMovesList() {
      const movesList = document.getElementById('movesList');
      if (game && game.moveHistory.length > 0) {
        let html = '';
        for (let i = 0; i < game.moveHistory.length; i += 2) {
          const moveNum = Math.floor(i / 2) + 1;
          const whiteMove = game.moveHistory[i];
          const blackMove = game.moveHistory[i + 1];
          
          html += `
            <div class="move-pair">
              <span class="move-number">${moveNum}.</span>
              <span>${whiteMove}</span>
              <span>${blackMove || ''}</span>
            </div>
          `;
        }
        movesList.innerHTML = html;
      }
    }

    function renderBoard() {
      const boardEl = document.getElementById('chessBoard');
      boardEl.innerHTML = '';

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const square = document.createElement('div');
          square.className = 'square ' + ((row + col) % 2 === 0 ? 'white' : 'black');
          square.textContent = game.board[row][col] || '';
          square.dataset.row = row;
          square.dataset.col = col;

          square.onclick = () => handleSquareClick(row, col);

          boardEl.appendChild(square);
        }
      }
    }

    function handleSquareClick(row, col) {
      if (!game || game.currentTurn !== playerColor) {
        updateStatus("It's not your turn!");
        return;
      }

      const piece = game.board[row][col];

      if (game.selectedPiece) {
        const fromRow = game.selectedPiece.row;
        const fromCol = game.selectedPiece.col;

        if (game.isValidMove(fromRow, fromCol, row, col)) {
          const move = game.makeMove(fromRow, fromCol, row, col);
          updateStatus('You played: ' + move.moveNotation);
          game.selectedPiece = null;
          renderBoard();
          updateMovesList();

          // FIXED: Check for game over conditions properly
          setTimeout(() => {
            if (!game.hasKing('white') || !game.hasKing('black')) {
              const winner = !game.hasKing('black') ? 'You Win!' : 'Computer Wins!';
              showVictory(winner + ' 🎉');
            } else if (game.isCheckmate()) {
              const winner = game.currentTurn === 'white' ? 'Computer Wins!' : 'You Win!';
              showVictory(winner + ' 🎉');
            } else {
              setTimeout(cpuMove, 1000);
            }
          }, 100);
        } else {
          updateStatus('Invalid move!');
          game.selectedPiece = null;
          renderBoard();
        }
      } else if (piece && game.getPieceColor(piece) === playerColor) {
        game.selectedPiece = { row, col };
        renderBoard();
        
        // Highlight selected square
        const squares = document.querySelectorAll('.square');
        squares.forEach(sq => {
          if (sq.dataset.row == row && sq.dataset.col == col) {
            sq.classList.add('selected');
          }
        });
      }
    }

    function cpuMove() {
      if (!game || game.currentTurn === playerColor) return;

      updateStatus('Computer is thinking...');

      const move = game.getRandomMove();
      if (move) {
        const moveResult = game.makeMove(move.fromRow, move.fromCol, move.toRow, move.toCol);
        updateStatus('Computer played: ' + moveResult.moveNotation);
        renderBoard();
        updateMovesList();

        // FIXED: Check for game over conditions properly
        setTimeout(() => {
          if (!game.hasKing('white') || !game.hasKing('black')) {
            const winner = !game.hasKing('black') ? 'You Win!' : 'Computer Wins!';
            showVictory(winner + ' 🤖');
          } else if (game.isCheckmate()) {
            const winner = game.currentTurn === 'white' ? 'You Win!' : 'Computer Wins!';
            showVictory(winner + ' 🤖');
          } else {
            updateStatus('Your turn');
          }
        }, 100);
      } else {
        updateStatus('Computer has no moves!');
      }
    }

    function showVictory(message) {
      const overlay = document.createElement('div');
      overlay.className = 'victory-overlay';
      overlay.innerHTML = `
        <div class="victory-content">
          <div class="victory-icon">🏆</div>
          <div class="victory-title">${message}</div>
          <div class="victory-subtitle">Well played!</div>
          <button class="btn btn-primary" onclick="closeVictory()">New Game</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function closeVictory() {
      document.querySelector('.victory-overlay').remove();
      newGame();
    }

    // Game Control Functions
    function startGame(color) {
      game = new ChessGame();
      playerColor = color;
      game.cpuDifficulty = parseInt(document.getElementById('difficultySelect').value);

      document.getElementById('lobby').classList.add('hidden');
      updatePlayerInfo();
      updateStatus('Game started! You are playing as ' + color);
      renderBoard();
      updateMovesList();

      if (color === 'black') {
        setTimeout(cpuMove, 1000);
      }
    }

    function newGame() {
      document.getElementById('lobby').classList.remove('hidden');
      game = null;
      playerColor = null;
      updateStatus('Choose game mode to start');
      updateMovesList();
    }

    function flipBoard() {
      boardFlipped = !boardFlipped;
      const board = document.getElementById('chessBoard');
      board.style.transform = boardFlipped ? 'rotate(180deg)' : 'none';
    }

    function resign() {
      if (confirm('Are you sure you want to resign?')) {
        showVictory('Computer Wins! (Resignation)');
      }
    }

    function showSettings() {
      alert('Settings panel coming soon!');
    }

    function showProfile() {
      alert('Profile panel coming soon!');
    }

    function changeTheme(theme) {
      console.log('Theme changed to:', theme);
    }

    // Initialize
    updateStatus('Choose game mode to start');
  </script>
</body>
</html>
