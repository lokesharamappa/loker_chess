<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master Pro - Working Chess Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .game-modes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .difficulty {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .diff-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .diff-btn:hover {
            background: #38a169;
        }

        .diff-btn.active {
            background: #2d3748;
        }

        .game-area {
            display: none;
            text-align: center;
        }

        .game-area.active {
            display: block;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .white-avatar {
            background: white;
            border: 2px solid #333;
        }

        .black-avatar {
            background: #333;
            color: white;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: #edf2f7;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }

        .board {
            display: inline-block;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .control-btn:hover {
            background: #5a67d8;
        }

        .menu-btn {
            background: #e53e3e;
        }

        .menu-btn:hover {
            background: #c53030;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">♟️ Chess Master Pro</h1>
            <p>Choose your game mode to start playing</p>
        </div>

        <!-- Game Mode Selection -->
        <div id="modeSelection">
            <div class="game-modes">
                <button class="mode-btn" onclick="selectMode('ai')">🤖 Play vs Computer</button>
                <button class="mode-btn" onclick="selectMode('friend')">👥 Play vs Friend</button>
            </div>

            <div class="difficulty" id="difficulty">
                <button class="diff-btn active" onclick="setDifficulty('easy')">Easy</button>
                <button class="diff-btn" onclick="setDifficulty('medium')">Medium</button>
                <button class="diff-btn" onclick="setDifficulty('hard')">Hard</button>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area" id="gameArea">
            <div class="game-info">
                <div class="player">
                    <div class="player-avatar white-avatar">♔</div>
                    <div>
                        <div><strong>White</strong></div>
                        <div id="whiteStatus">Your turn</div>
                    </div>
                </div>
                <div class="player">
                    <div class="player-avatar black-avatar">♚</div>
                    <div>
                        <div><strong>Black</strong></div>
                        <div id="blackStatus">Computer</div>
                    </div>
                </div>
            </div>

            <div class="status" id="gameStatus">Game in progress</div>

            <div class="board">
                <div id="board" style="width: 400px; height: 400px;"></div>
            </div>

            <div class="controls">
                <button class="control-btn" onclick="undoMove()">↶ Undo</button>
                <button class="control-btn" onclick="resetGame()">🔄 Reset</button>
                <button class="control-btn menu-btn" onclick="backToMenu()">🏠 Menu</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>

    <script>
        let board = null;
        let chess = null;
        let gameMode = null;
        let difficulty = 'easy';
        let playerColor = 'white';
        let moveHistory = [];

        // Initialize
        console.log('Chess app loaded');
        updateStatus('Choose a game mode to start');

        function selectMode(mode) {
            gameMode = mode;
            console.log('Selected mode:', mode);

            if (mode === 'ai') {
                document.getElementById('difficulty').style.display = 'flex';
                updateStatus('Select difficulty level');
            } else {
                document.getElementById('difficulty').style.display = 'none';
                startGame('friend');
            }
        }

        function setDifficulty(level) {
            difficulty = level;
            console.log('Difficulty set to:', level);
            
            // Update button states
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            startGame('ai');
        }

        function startGame(mode) {
            console.log('Starting game:', mode);
            
            // Hide mode selection, show game
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('gameArea').classList.add('active');

            // Set player info
            if (mode === 'ai') {
                playerColor = 'white';
                document.getElementById('whiteStatus').textContent = 'Your turn';
                document.getElementById('blackStatus').textContent = 'Computer';
            } else {
                playerColor = 'white';
                document.getElementById('whiteStatus').textContent = 'Player 1';
                document.getElementById('blackStatus').textContent = 'Player 2';
            }

            initializeGame();
        }

        function initializeGame() {
            console.log('Initializing chess game');
            
            try {
                // Create chess game
                chess = new Chess();
                moveHistory = [];
                console.log('Chess game created');

                // Create board configuration
                const cfg = {
                    draggable: true,
                    position: chess.fen(),
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                    onDragStart: onDragStart,
                    onDrop: onDrop,
                    onSnapEnd: onSnapEnd
                };

                // Destroy existing board if it exists
                if (board) {
                    board.destroy();
                }

                // Create new board
                board = ChessBoard('board', cfg);
                console.log('Chess board created');
                
                updateStatus('Game started! Make your move');
                
            } catch (error) {
                console.error('Error initializing game:', error);
                updateStatus('ERROR: ' + error.message);
            }
        }

        function onDragStart(source, piece, position, orientation) {
            console.log('Drag start:', source, piece);
            
            if (!chess || chess.game_over()) {
                console.log('Game over or no chess object');
                return false;
            }

            // In AI mode, only allow dragging player's pieces
            if (gameMode === 'ai') {
                const pieceColor = piece.charAt(0) === 'w' ? 'w' : 'b';
                const playerPieceColor = playerColor === 'white' ? 'w' : 'b';
                const currentTurn = chess.turn();
                
                console.log('Piece color:', pieceColor, 'Player color:', playerPieceColor, 'Current turn:', currentTurn);
                
                if (pieceColor !== playerPieceColor || currentTurn !== playerPieceColor) {
                    console.log('Cannot move this piece');
                    return false;
                }
            }

            return true;
        }

        function onDrop(source, target) {
            console.log('Drop:', source, 'to:', target);
            
            if (!chess) {
                console.log('No chess object');
                return 'snapback';
            }

            try {
                const move = chess.move({
                    from: source,
                    to: target,
                    promotion: 'q'
                });

                console.log('Move result:', move);

                if (move === null) {
                    console.log('Illegal move');
                    updateStatus('Illegal move! Try again');
                    return 'snapback';
                }

                moveHistory.push(move);
                board.position(chess.fen());
                updateStatus('You played: ' + move.san);

                // Check game over
                if (chess.in_checkmate()) {
                    const winner = chess.turn() === 'w' ? 'Black' : 'White';
                    updateStatus('CHECKMATE! ' + winner + ' wins!');
                    return;
                } else if (chess.in_draw()) {
                    updateStatus('Draw!');
                    return;
                } else if (chess.in_check()) {
                    updateStatus('Check!');
                }

                // AI move in AI mode
                if (gameMode === 'ai' && !chess.game_over()) {
                    updateStatus('Computer is thinking...');
                    setTimeout(makeAIMove, 1000);
                } else {
                    updateTurnStatus();
                }

            } catch (error) {
                console.error('Move error:', error);
                updateStatus('Move error: ' + error.message);
                return 'snapback';
            }
        }

        function onSnapEnd() {
            if (board && chess) {
                board.position(chess.fen());
            }
        }

        function makeAIMove() {
            console.log('Making AI move');
            
            if (!chess || chess.game_over()) {
                console.log('Game over or no chess object');
                return;
            }

            const moves = chess.moves({ verbose: true });
            console.log('Available moves:', moves.length);
            
            if (moves.length === 0) {
                console.log('No moves available');
                return;
            }

            let selectedMove;
            
            if (difficulty === 'easy') {
                // Random move
                selectedMove = moves[Math.floor(Math.random() * moves.length)];
            } else if (difficulty === 'medium') {
                // Prefer captures and checks
                const captures = moves.filter(m => m.captured);
                if (captures.length > 0) {
                    selectedMove = captures[Math.floor(Math.random() * captures.length)];
                } else {
                    selectedMove = moves[Math.floor(Math.random() * moves.length)];
                }
            } else {
                // Hard: Simple evaluation
                selectedMove = moves.reduce((best, move) => {
                    const score = evaluateMove(move);
                    return score > best.score ? { move, score } : best;
                }, { move: moves[0], score: -Infinity }).move;
            }

            console.log('AI selected move:', selectedMove);

            const move = chess.move(selectedMove);
            
            if (move) {
                moveHistory.push(move);
                board.position(chess.fen());
                updateStatus('Computer played: ' + move.san);

                // Check game over
                if (chess.in_checkmate()) {
                    updateStatus('CHECKMATE! Computer wins!');
                } else if (chess.in_draw()) {
                    updateStatus('Draw!');
                } else if (chess.in_check()) {
                    updateStatus('Check! Your turn');
                } else {
                    updateStatus('Your turn');
                }
            } else {
                console.log('AI move failed');
            }
        }

        function evaluateMove(move) {
            let score = 0;
            
            // Capture value
            if (move.captured) {
                const pieceValues = { 'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 0 };
                score += pieceValues[move.captured] || 0;
            }
            
            // Center control
            const centerSquares = ['d4', 'e4', 'd5', 'e5'];
            if (centerSquares.includes(move.to)) {
                score += 1;
            }
            
            // Random factor for variety
            score += Math.random() * 0.5;
            
            return score;
        }

        function updateTurnStatus() {
            const turn = chess.turn();
            if (gameMode === 'friend') {
                if (turn === 'w') {
                    document.getElementById('whiteStatus').textContent = 'Player 1\'s turn';
                    document.getElementById('blackStatus').textContent = 'Player 2';
                } else {
                    document.getElementById('whiteStatus').textContent = 'Player 1';
                    document.getElementById('blackStatus').textContent = 'Player 2\'s turn';
                }
            }
        }

        function undoMove() {
            if (moveHistory.length >= 2) {
                chess.undo();
                chess.undo();
                board.position(chess.fen());
                moveHistory.pop();
                moveHistory.pop();
                updateStatus('Move undone');
            }
        }

        function resetGame() {
            if (chess) {
                chess.reset();
                moveHistory = [];
            }
            if (board) {
                board.position(chess.fen());
            }
            updateStatus('Game reset');
        }

        function backToMenu() {
            document.getElementById('modeSelection').style.display = 'block';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('difficulty').style.display = 'none';
            resetGame();
            updateStatus('Choose a game mode to start');
        }

        function updateStatus(message) {
            document.getElementById('gameStatus').textContent = message;
            console.log('Status:', message);
        }
    </script>
</body>
</html>
