<!DOCTYPE html>
<html>
<head>
<style>
body { background: #2b2d3a; padding: 20px; }
.test-square {
  width: 100px;
  height: 100px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 10px;
  border: 2px solid #8b7355;
}
.light { background: #f0d9b5; }
.dark { background: #b58863; }

.chess-piece {
  font-size: 64px;
  font-weight: 600;
  position: relative;
  z-index: 10;
}

/* White pieces */
.chess-piece.white {
  color: #ffffff;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
  filter: drop-shadow(1px 1px 3px rgba(0, 0, 0, 0.6));
}

/* Black pieces with BLACK fill and WHITE outline (traditional chess style) */
.chess-piece.black {
  color: #000000;
  text-shadow: 
    -2px -2px 0 #ffffff,
    2px -2px 0 #ffffff,
    -2px 2px 0 #ffffff,
    2px 2px 0 #ffffff,
    -1px -1px 0 #ffffff,
    1px -1px 0 #ffffff,
    -1px 1px 0 #ffffff,
    1px 1px 0 #ffffff,
    0 0 4px #ffffff,
    0 0 8px #ffffff,
    0 0 12px #ffffff;
  filter: 
    drop-shadow(2px 2px 4px rgba(255, 255, 255, 0.9))
    drop-shadow(0 0 4px #ffffff)
    drop-shadow(0 0 8px #ffffff)
    drop-shadow(0 0 12px #ffffff);
  -webkit-text-stroke: 4px #ffffff;
  paint-order: stroke fill;
  position: relative;
  z-index: 10;
}
</style>
</head>
<body>
<h2 style="color: white;">Testing Black Piece Outlines</h2>

<div style="margin: 20px 0;">
  <h3 style="color: white;">On Light Square:</h3>
  <div class="test-square light">
    <span class="chess-piece white">♔</span>
  </div>
  <div class="test-square light">
    <span class="chess-piece black">♚</span>
  </div>
</div>

<div style="margin: 20px 0;">
  <h3 style="color: white;">On Dark Square:</h3>
  <div class="test-square dark">
    <span class="chess-piece white">♔</span>
  </div>
  <div class="test-square dark">
    <span class="chess-piece black">♚</span>
  </div>
</div>

<div style="margin: 20px 0;">
  <h3 style="color: white;">All Black Pieces:</h3>
  <div class="test-square light">
    <span class="chess-piece black">♜</span>
  </div>
  <div class="test-square dark">
    <span class="chess-piece black">♞</span>
  </div>
  <div class="test-square light">
    <span class="chess-piece black">♝</span>
  </div>
  <div class="test-square dark">
    <span class="chess-piece black">♛</span>
  </div>
  <div class="test-square light">
    <span class="chess-piece black">♚</span>
  </div>
  <div class="test-square dark">
    <span class="chess-piece black">♟</span>
  </div>
</div>
</body>
</html>
