<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Master Pro</title>
  <link rel="stylesheet" href="./style-chesscom.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1 class="logo">♟️ Chess Master Pro</h1>
    </div>
    <div class="header-center">
      <div class="header-title">Chess Master Pro</div>
    </div>
    <div class="header-right">
      <button class="header-btn" id="settingsBtn">⚙️ Settings</button>
      <button class="header-btn" id="profileBtn">👤 Profile</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container" id="mainContainer" style="display: none;">
    <!-- Left Panel - Game Info -->
    <div class="left-panel">
      <!-- Player Cards -->
      <div class="player-card" id="whitePlayer">
        <div class="player-info">
          <div class="player-avatar">♔</div>
          <div class="player-details">
            <div class="player-name">White</div>
            <div class="player-rating">1200</div>
          </div>
        </div>
        <div class="player-time" id="whiteTime">10:00</div>
      </div>

      <div class="player-card" id="blackPlayer">
        <div class="player-info">
          <div class="player-avatar">♚</div>
          <div class="player-details">
            <div class="player-name">Black</div>
            <div class="player-rating">1200</div>
          </div>
        </div>
        <div class="player-time" id="blackTime">10:00</div>
      </div>

      <!-- Game Status -->
      <div class="game-status">
        <div class="status-text" id="gameStatus">Game in progress</div>
        <div class="move-count" id="moveCount">0 moves</div>
      </div>

      <!-- Settings -->
      <div class="settings-card">
        <div class="setting-row">
          <span class="setting-label">Theme</span>
          <div class="setting-control">
            <select class="select-control" id="themeSelect">
              <option value="classic">Classic</option>
              <option value="wood">Wood</option>
              <option value="green">Green</option>
              <option value="gray">Gray</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Board Size</span>
          <div class="setting-control">
            <select class="select-control" id="sizeSelect">
              <option value="480">Small</option>
              <option value="560" selected>Medium</option>
              <option value="640">Large</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Sound</span>
          <div class="setting-control">
            <input type="checkbox" class="checkbox-control" id="soundToggle" checked>
          </div>
        </div>
      </div>
    </div>

    <!-- Center Panel - Board -->
    <div class="center-panel">
      <div class="board-container">
        <div id="board"></div>
      </div>
      <div class="board-controls">
        <button class="board-btn" id="newGameBtn">New Game</button>
        <button class="board-btn" id="resignBtn">Resign</button>
        <button class="board-btn" id="analysisBtn">Analysis</button>
        <button class="board-btn" id="downloadBtn">Download PGN</button>
      </div>
    </div>

    <!-- Right Panel - Moves, Analysis, Chat -->
    <div class="right-panel">
      <!-- Moves List -->
      <div class="moves-card">
        <div class="card-header">
          <h3>Moves</h3>
          <div class="move-controls">
            <button class="move-btn" id="flipBoardBtn">↻ Flip</button>
          </div>
        </div>
        <div class="moves-list" id="movesList">
          <!-- Moves will be populated here -->
        </div>
      </div>

      <!-- Analysis Card -->
      <div class="analysis-card">
        <div class="card-header">
          <h3>Analysis</h3>
        </div>
        <div class="analysis-content">
          <div class="eval-bar">
            <div class="eval-fill" id="evalBar"></div>
          </div>
          <div class="eval-text" id="evalText">0.0</div>
          <div class="analysis-info" id="analysisInfo">Position is equal</div>
        </div>
      </div>

      <!-- Chat Card -->
      <div class="chat-card">
        <div class="card-header">
          <h3>Chat</h3>
        </div>
        <div class="chat-messages" id="chatMessages">
          <!-- Chat messages will appear here -->
        </div>
        <div class="chat-input-container">
          <input type="text" class="chat-input" id="chatInput" placeholder="Type a message...">
          <button class="chat-send-btn" id="chatSendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lobby Modal -->
  <div class="lobby-container" id="lobbyContainer">
    <div class="lobby-card">
      <div class="lobby-header">
        <h2>Chess Master Pro</h2>
        <p>Choose your game mode</p>
      </div>
      
      <div class="lobby-section">
        <h3>Online Play</h3>
        <input type="text" class="lobby-input" id="roomInput" placeholder="Enter room ID (e.g., game123)">
        
        <div class="lobby-buttons">
          <button class="lobby-btn primary" id="joinRoomBtn">Create / Join Room</button>
          <button class="lobby-btn secondary" id="spectateBtn">Spectate</button>
        </div>
      </div>

      <div class="lobby-section">
        <h3>Computer Play</h3>
        <div class="cpu-options">
          <button class="lobby-btn secondary" id="cpuWhiteBtn">Play vs Computer (White)</button>
          <button class="lobby-btn secondary" id="cpuBlackBtn">Play vs Computer (Black)</button>
        </div>

        <div style="margin-top: 24px;">
          <label class="setting-label">Computer Difficulty</label>
          <select class="select-control" id="difficultySelect" style="width: 100%; margin-top: 8px;">
            <option value="1">Easy (Beginner)</option>
            <option value="2" selected>Medium (Intermediate)</option>
            <option value="3">Hard (Advanced)</option>
            <option value="4">Expert (Master)</option>
            <option value="5">Grandmaster</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastStack"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>
  
  <script>
    // Main Chess Application
    (() => {
      const $ = (id) => document.getElementById(id);
      
      // Game state
      let board = null;
      let chess = null;
      let gameMode = 'online'; // 'online' or 'cpu'
      let humanColor = null;
      let cpuColor = null;
      let cpuDepth = 2;
      let ended = false;
      
      // Get elements
      const lobbyContainer = $('lobbyContainer');
      const mainContainer = $('mainContainer');
      const boardEl = $('board');
      const cpuWhiteBtn = $('cpuWhiteBtn');
      const cpuBlackBtn = $('cpuBlackBtn');
      const difficultySelect = $('difficultySelect');
      const gameStatus = $('gameStatus');
      const moveCount = $('moveCount');
      const whiteTime = $('whiteTime');
      const blackTime = $('blackTime');
      const movesList = $('movesList');
      const whitePlayer = $('whitePlayer');
      const blackPlayer = $('blackPlayer');
      
      // Initialize
      function init() {
        console.log('Chess app initializing...');
        
        // Setup event listeners
        cpuWhiteBtn.addEventListener('click', () => startCPUGame('w'));
        cpuBlackBtn.addEventListener('click', () => startCPUGame('b'));
        
        // Setup other controls
        $('newGameBtn').addEventListener('click', () => showLobby());
        $('resignBtn').addEventListener('click', () => resign());
        $('flipBoardBtn').addEventListener('click', () => flipBoard());
        
        // Settings
        $('themeSelect').addEventListener('change', changeTheme);
        $('sizeSelect').addEventListener('change', changeSize);
        $('difficultySelect').addEventListener('change', changeDifficulty);
        
        console.log('Chess app initialized');
      }
      
      function startCPUGame(color) {
        console.log('Starting CPU game as', color);
        
        gameMode = 'cpu';
        humanColor = color;
        cpuColor = color === 'w' ? 'b' : 'w';
        cpuDepth = parseInt(difficultySelect.value);
        
        // Create chess game
        chess = new window.Chess();
        
        // Create board
        createBoard();
        
        // Update UI
        showGame();
        updatePlayerInfo();
        updateGameStatus();
        
        // CPU moves first if human is black
        if (humanColor === 'b') {
          setTimeout(makeCPUMove, 1000);
        }
        
        console.log('CPU game started');
      }
      
      function createBoard() {
        if (board) {
          board.destroy();
        }
        
        const cfg = {
          draggable: true,
          position: chess.fen(),
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
          onDragStart: onDragStart,
          onDrop: onDrop,
          onSnapEnd: onSnapEnd
        };
        
        board = window.ChessBoard(boardEl, cfg);
        
        // Apply chess.com styling
        boardEl.style.borderRadius = '4px';
        boardEl.style.overflow = 'hidden';
        boardEl.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.3)';
        
        console.log('Board created');
      }
      
      function showGame() {
        lobbyContainer.style.display = 'none';
        mainContainer.style.display = 'grid';
      }
      
      function showLobby() {
        lobbyContainer.style.display = 'block';
        mainContainer.style.display = 'none';
        ended = false;
      }
      
      function updatePlayerInfo() {
        if (gameMode === 'cpu') {
          const whiteName = humanColor === 'w' ? 'You' : 'Computer';
          const blackName = humanColor === 'b' ? 'You' : 'Computer';
          
          whitePlayer.querySelector('.player-name').textContent = whiteName;
          blackPlayer.querySelector('.player-name').textContent = blackName;
        }
      }
      
      function updateGameStatus() {
        if (!chess) return;
        
        if (ended) {
          return;
        }
        
        if (chess.in_checkmate()) {
          const winner = chess.turn() === 'w' ? 'Black' : 'White';
          gameStatus.textContent = `Checkmate! ${winner} wins!`;
          gameStatus.style.color = '#27ae60';
          ended = true;
          showGameOverlay(`Checkmate! ${winner} wins!`, true);
        } else if (chess.in_draw()) {
          gameStatus.textContent = 'Draw!';
          gameStatus.style.color = '#f39c12';
          ended = true;
          showGameOverlay('Draw!', false);
        } else if (chess.in_stalemate()) {
          gameStatus.textContent = 'Stalemate!';
          gameStatus.style.color = '#f39c12';
          ended = true;
          showGameOverlay('Stalemate!', false);
        } else if (chess.in_check()) {
          gameStatus.textContent = 'Check!';
          gameStatus.style.color = '#e74c3c';
        } else {
          const turn = chess.turn() === 'w' ? 'White' : 'Black';
          gameStatus.textContent = `${turn} to move`;
          gameStatus.style.color = '#2c3e50';
        }
        
        updateMoveCount();
      }
      
      function updateMoveCount() {
        if (chess) {
          const moves = chess.history();
          moveCount.textContent = `${moves.length} moves`;
          renderMoves();
        }
      }
      
      function renderMoves() {
        if (!chess) return;
        
        const history = chess.history({ verbose: true });
        let html = '';
        
        for (let i = 0; i < history.length; i += 2) {
          const moveNum = Math.floor(i / 2) + 1;
          const whiteMove = history[i];
          const blackMove = history[i + 1];
          
          html += `
            <div class="move-pair">
              <span class="move-number">${moveNum}.</span>
              <span class="white-move">${whiteMove.san}</span>
              ${blackMove ? `<span class="black-move">${blackMove.san}</span>` : ''}
            </div>
          `;
        }
        
        movesList.innerHTML = html;
        movesList.scrollTop = movesList.scrollHeight;
      }
      
      function makeCPUMove() {
        if (!chess || gameMode !== 'cpu' || chess.turn() !== cpuColor || ended) {
          return;
        }
        
        console.log('CPU is thinking...');
        
        const moves = chess.moves({ verbose: true });
        if (moves.length === 0) return;
        
        // Simple random move for now (can be improved with AI)
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        const move = chess.move(randomMove);
        
        if (move) {
          board.position(chess.fen());
          updateGameStatus();
          console.log('CPU played:', move.san);
        }
      }
      
      function showGameOverlay(message, isVictory) {
        const overlay = document.createElement('div');
        overlay.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: ${isVictory 
            ? 'linear-gradient(135deg, rgba(76, 175, 80, 0.95), rgba(56, 142, 60, 0.95))' 
            : 'linear-gradient(135deg, rgba(255, 152, 0, 0.95), rgba(255, 193, 7, 0.95))'};
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 10000;
          animation: fadeIn 0.5s ease-out;
        `;
        
        overlay.innerHTML = `
          <div style="text-align: center; color: white; animation: bounceIn 0.6s ease-out;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">${isVictory ? '👑' : '🤝'}</div>
            <div style="font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px;">${message}</div>
            <div style="font-size: 1.2rem; margin-bottom: 2rem;">${isVictory ? 'Congratulations!' : 'Well played!'}</div>
            <button onclick="this.closest('div').parentElement.remove(); showLobby();" style="
              background: rgba(255, 255, 255, 0.2);
              border: 2px solid white;
              color: white;
              padding: 1rem 2rem;
              font-size: 1.1rem;
              font-weight: 700;
              border-radius: 50px;
              cursor: pointer;
            ">New Game</button>
          </div>
        `;
        
        document.body.appendChild(overlay);
      }
      
      // Chess board event handlers
      function onDragStart(source, piece, position, orientation) {
        if (!chess || ended) return false;
        
        // In CPU mode, only allow dragging human pieces
        if (gameMode === 'cpu' && humanColor) {
          const pieceColor = piece.charAt(0) === 'w' ? 'w' : 'b';
          if (pieceColor !== humanColor) return false;
        }
        
        return !chess.game_over();
      }
      
      function onDrop(source, target) {
        if (!chess) return 'snapback';
        
        try {
          const move = chess.move({
            from: source,
            to: target,
            promotion: 'q'
          });
          
          if (move === null) return 'snapback';
          
          board.position(chess.fen());
          updateGameStatus();
          
          // Trigger CPU move if needed
          if (gameMode === 'cpu' && cpuColor === chess.turn()) {
            setTimeout(makeCPUMove, 1000);
          }
          
        } catch (error) {
          console.error('Move error:', error);
          return 'snapback';
        }
      }
      
      function onSnapEnd() {
        if (board && chess) {
          board.position(chess.fen());
        }
      }
      
      // UI functions
      function changeTheme() {
        const theme = $('themeSelect').value;
        document.body.className = document.body.className.replace(/theme-\w+/g, '');
        document.body.classList.add(`theme-${theme}`);
        if (board) board.position(chess.fen());
      }
      
      function changeSize() {
        if (board && chess) {
          const size = parseInt($('sizeSelect').value, 10);
          boardEl.style.width = size + 'px';
          boardEl.style.height = size + 'px';
          if (window.ChessBoard && window.ChessBoard.resize) {
            window.ChessBoard.resize();
          }
        }
      }
      
      function changeDifficulty() {
        cpuDepth = parseInt(difficultySelect.value, 10);
      }
      
      function flipBoard() {
        if (board) {
          board.flip();
        }
      }
      
      function resign() {
        if (confirm('Are you sure you want to resign?')) {
          ended = true;
          const winner = humanColor === 'w' ? 'Black' : 'White';
          showGameOverlay(`Resignation! ${winner} wins!`, false);
        }
      }
      
      // Add CSS animations
      const style = document.createElement('style');
      style.textContent = `
        @keyframes fadeIn {
          from { opacity: 0; transform: scale(0.8); }
          to { opacity: 1; transform: scale(1); }
        }
        @keyframes bounceIn {
          0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
          50% { transform: scale(1.05) rotate(5deg); }
          70% { transform: scale(0.9) rotate(-2deg); }
          100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
      `;
      document.head.appendChild(style);
      
      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      // Make functions globally available
      window.showLobby = showLobby;
      window.showGame = showGame;
    })();
  </script>
</body>
</html>
