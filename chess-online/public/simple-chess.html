<!DOCTYPE html>
<html>
<head>
  <title>Simple Working Chess</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #2c3e50; color: white; }
    .container { max-width: 800px; margin: 0 auto; }
    .lobby { background: #34495e; padding: 30px; border-radius: 8px; text-align: center; }
    .game { background: #34495e; padding: 20px; border-radius: 8px; display: none; }
    button { background: #3498db; color: white; border: none; padding: 15px 30px; margin: 10px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #2980b9; }
    .board { margin: 20px auto; display: inline-block; }
    .status { background: #27ae60; padding: 15px; border-radius: 4px; margin: 10px 0; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>♟️ Simple Chess Game</h1>
    
    <!-- Lobby -->
    <div class="lobby" id="lobby">
      <h2>Choose Game Mode</h2>
      <button onclick="startGame('white')">Play as White</button>
      <button onclick="startGame('black')">Play as Black</button>
    </div>
    
    <!-- Game -->
    <div class="game" id="game">
      <div class="status" id="status">Click a button to start</div>
      <div class="board">
        <div id="board" style="width: 560px; height: 560px;"></div>
      </div>
      <button onclick="backToLobby()">Back to Lobby</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>

  <script>
    let board = null;
    let chess = null;
    let playerColor = null;
    
    function updateStatus(message) {
      document.getElementById('status').textContent = message;
      console.log(message);
    }
    
    function startGame(color) {
      console.log('Starting game as ' + color);
      updateStatus('Starting game...');
      
      try {
        // Hide lobby, show game
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        
        // Set player color
        playerColor = color;
        
        // Create chess game
        chess = new Chess();
        updateStatus('Chess game created');
        
        // Create board
        const cfg = {
          draggable: true,
          position: chess.fen(),
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
          onDragStart: onDragStart,
          onDrop: onDrop,
          onSnapEnd: onSnapEnd
        };
        
        board = ChessBoard('board', cfg);
        updateStatus('Board created - You are playing as ' + color);
        
        // If player is black, CPU moves first
        if (color === 'black') {
          setTimeout(cpuMove, 1000);
        }
        
      } catch (error) {
        updateStatus('ERROR: ' + error.message);
        console.error(error);
      }
    }
    
    function backToLobby() {
      document.getElementById('lobby').style.display = 'block';
      document.getElementById('game').style.display = 'none';
      if (board) {
        board.destroy();
        board = null;
      }
      chess = null;
      updateStatus('Game ended');
    }
    
    function onDragStart(source, piece, position, orientation) {
      if (!chess || chess.game_over()) return false;
      
      // Only allow dragging player's pieces
      const pieceColor = piece.charAt(0) === 'w' ? 'w' : 'b';
      const playerPieceColor = playerColor === 'white' ? 'w' : 'b';
      
      if (pieceColor !== playerPieceColor) {
        updateStatus('You can only move your own pieces');
        return false;
      }
      
      return true;
    }
    
    function onDrop(source, target) {
      if (!chess) return 'snapback';
      
      try {
        const move = chess.move({
          from: source,
          to: target,
          promotion: 'q'
        });
        
        if (move === null) {
          updateStatus('Illegal move');
          return 'snapback';
        }
        
        board.position(chess.fen());
        updateStatus('You played: ' + move.san);
        
        // Check game over
        if (chess.in_checkmate()) {
          const winner = chess.turn() === 'w' ? 'Black' : 'White';
          updateStatus('CHECKMATE! ' + winner + ' wins!');
        } else if (chess.in_draw()) {
          updateStatus('Draw!');
        } else if (chess.in_check()) {
          updateStatus('Check!');
        }
        
        // CPU move
        setTimeout(cpuMove, 1000);
        
      } catch (error) {
        updateStatus('Move error: ' + error.message);
        return 'snapback';
      }
    }
    
    function onSnapEnd() {
      if (board && chess) {
        board.position(chess.fen());
      }
    }
    
    function cpuMove() {
      if (!chess || chess.game_over()) return;
      
      const moves = chess.moves({ verbose: true });
      if (moves.length === 0) return;
      
      // Make random move
      const randomMove = moves[Math.floor(Math.random() * moves.length)];
      const move = chess.move(randomMove);
      
      if (move) {
        board.position(chess.fen());
        updateStatus('CPU played: ' + move.san);
        
        // Check game over
        if (chess.in_checkmate()) {
          const winner = chess.turn() === 'w' ? 'Black' : 'White';
          updateStatus('CHECKMATE! ' + winner + ' wins!');
        } else if (chess.in_draw()) {
          updateStatus('Draw!');
        } else if (chess.in_check()) {
          updateStatus('Check!');
        } else {
          const turn = chess.turn() === 'w' ? 'White' : 'Black';
          const playerTurn = playerColor === 'white' ? 'White' : 'Black';
          if (turn === playerTurn) {
            updateStatus('Your turn');
          }
        }
      }
    }
    
    // Initialize
    console.log('Simple chess loaded');
    updateStatus('Choose a game mode to start');
  </script>
</body>
</html>
