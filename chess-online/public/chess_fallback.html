<!DOCTYPE html>
<html>
<head>
    <title>World-Class Chess App - Fallback</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 30px;
        }

        .title {
            font-size: 42px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            gap: 1px;
            border: 3px solid #333;
            margin: 20px auto;
            background: #333;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .square:nth-child(8n+1), .square:nth-child(8n+3), .square:nth-child(8n+5), .square:nth-child(8n+7) {
            background: #f0d9b5;
        }

        .square:nth-child(8n+2), .square:nth-child(8n+4), .square:nth-child(8n+6), .square:nth-child(8n+8) {
            background: #b58863;
        }

        .square.selected {
            background: #f6f669 !important;
            box-shadow: inset 0 0 0 3px #ff6b6b;
        }

        .square.valid-move {
            background: #aaffaa !important;
            box-shadow: inset 0 0 0 2px #4ade80;
        }

        .square.valid-capture {
            background: #ffaaaa !important;
            box-shadow: inset 0 0 0 2px #f87171;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .control-btn.primary {
            background: #48bb78;
        }

        .control-btn.primary:hover {
            background: #38a169;
        }

        .control-btn.danger {
            background: #e53e3e;
        }

        .control-btn.danger:hover {
            background: #c53030;
        }

        .game-status {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 18px;
        }

        .move-history {
            max-height: 200px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .test-status {
            background: #fef3cd;
            border: 2px solid #f0ad4e;
            color: #92400e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .test-status.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">World-Class Chess App - Fallback</h1>
            <p class="subtitle">Pure JavaScript Chess Engine - No External Dependencies</p>
        </header>

        <div class="test-status" id="testStatus">
            Initializing...
        </div>

        <div class="game-controls">
            <button class="control-btn primary" onclick="startNewGame()">Start Game</button>
            <button class="control-btn" onclick="undoMove()">Undo</button>
            <button class="control-btn danger" onclick="resetGame()">Reset</button>
        </div>

        <div class="game-status" id="status">Click "Start Game" to begin</div>

        <div class="board" id="board"></div>

        <div class="move-history">
            <div style="font-weight: bold; margin-bottom: 10px;">Move History</div>
            <div id="moveList">No moves yet</div>
        </div>
    </div>

    <script>
        // Pure JavaScript Chess Engine - No External Dependencies
        console.log('Loading Pure JavaScript Chess Engine...');
        
        // Test status
        function updateTestStatus(message, type = 'info') {
            const statusEl = document.getElementById('testStatus');
            statusEl.textContent = message;
            statusEl.className = 'test-status';
            if (type === 'success') {
                statusEl.classList.add('success');
            }
            console.log('TEST:', message);
        }

        // Simple Chess Engine
        class SimpleChessEngine {
            constructor() {
                this.board = this.initializeBoard();
                this.currentTurn = 'white';
                this.selectedSquare = null;
                this.moveHistory = [];
                this.pieces = {
                    'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
                    'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
                };
                updateTestStatus('✅ Chess Engine Initialized', 'success');
            }

            initializeBoard() {
                return [
                    ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
                    ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
                    [null, null, null, null, null, null, null, null],
                    [null, null, null, null, null, null, null, null],
                    [null, null, null, null, null, null, null, null],
                    [null, null, null, null, null, null, null, null],
                    ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
                    ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
                ];
            }

            renderBoard() {
                const boardElement = document.getElementById('board');
                boardElement.innerHTML = '';
                
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.className = 'square';
                        square.dataset.row = row;
                        square.dataset.col = col;
                        
                        const piece = this.board[row][col];
                        if (piece) {
                            square.textContent = this.pieces[piece];
                        }
                        
                        square.onclick = () => this.handleSquareClick(row, col);
                        boardElement.appendChild(square);
                    }
                }
            }

            handleSquareClick(row, col) {
                const piece = this.board[row][col];
                const pieceColor = piece ? (piece === piece.toUpperCase() ? 'white' : 'black') : null;
                
                if (this.selectedSquare === null) {
                    // Select piece
                    if (piece && pieceColor === this.currentTurn) {
                        this.selectedSquare = { row, col };
                        this.highlightSquare(row, col, 'selected');
                        this.showValidMoves(row, col);
                        this.updateStatus(`Selected ${pieceColor} ${piece}`);
                    } else {
                        this.updateStatus('Not your turn or no piece selected!');
                    }
                } else {
                    // Move piece
                    if (row === this.selectedSquare.row && col === this.selectedSquare.col) {
                        // Deselect
                        this.clearHighlights();
                        this.selectedSquare = null;
                        this.updateStatus('Piece deselected');
                    } else if (this.isValidMove(this.selectedSquare.row, this.selectedSquare.col, row, col)) {
                        this.makeMove(this.selectedSquare.row, this.selectedSquare.col, row, col);
                        this.clearHighlights();
                        this.selectedSquare = null;
                    } else {
                        this.updateStatus('Invalid move!');
                    }
                }
            }

            highlightSquare(row, col, className) {
                const squares = document.querySelectorAll('.square');
                squares[row * 8 + col].classList.add(className);
            }

            showValidMoves(fromRow, fromCol) {
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        if (this.isValidMove(fromRow, fromCol, row, col)) {
                            const targetPiece = this.board[row][col];
                            if (targetPiece) {
                                this.highlightSquare(row, col, 'valid-capture');
                            } else {
                                this.highlightSquare(row, col, 'valid-move');
                            }
                        }
                    }
                }
            }

            clearHighlights() {
                document.querySelectorAll('.square').forEach(square => {
                    square.classList.remove('selected', 'valid-move', 'valid-capture');
                });
            }

            isValidMove(fromRow, fromCol, toRow, toCol) {
                const piece = this.board[fromRow][fromCol];
                const targetPiece = this.board[toRow][toCol];
                
                if (!piece) return false;
                
                // Can't capture own piece
                if (targetPiece) {
                    const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                    const targetColor = targetPiece === targetPiece.toUpperCase() ? 'white' : 'black';
                    if (pieceColor === targetColor) return false;
                }
                
                const pieceType = piece.toLowerCase();
                const rowDiff = toRow - fromRow;
                const colDiff = toCol - fromCol;
                
                switch (pieceType) {
                    case 'p': // Pawn
                        const direction = piece === 'P' ? 1 : -1;
                        const startRow = piece === 'P' ? 1 : 6;
                        
                        // Forward move
                        if (colDiff === 0 && !targetPiece) {
                            if (rowDiff === direction) return true;
                            if (fromRow === startRow && rowDiff === 2 * direction && !this.board[fromRow + direction][fromCol]) return true;
                        }
                        
                        // Capture
                        if (Math.abs(colDiff) === 1 && Math.abs(rowDiff) === 1 && targetPiece) {
                            if (rowDiff === direction) return true;
                        }
                        
                        return false;

                    case 'n': // Knight
                        return (Math.abs(rowDiff) === 2 && Math.abs(colDiff) === 1) || (Math.abs(rowDiff) === 1 && Math.abs(colDiff) === 2);

                    case 'r': // Rook
                        if (rowDiff === 0 || colDiff === 0) {
                            return this.isPathClear(fromRow, fromCol, toRow, toCol);
                        }
                        return false;

                    case 'b': // Bishop
                        if (Math.abs(rowDiff) === Math.abs(colDiff)) {
                            return this.isPathClear(fromRow, fromCol, toRow, toCol);
                        }
                        return false;

                    case 'q': // Queen
                        if (rowDiff === 0 || colDiff === 0 || Math.abs(rowDiff) === Math.abs(colDiff)) {
                            return this.isPathClear(fromRow, fromCol, toRow, toCol);
                        }
                        return false;

                    case 'k': // King
                        return Math.abs(rowDiff) <= 1 && Math.abs(colDiff) <= 1;

                    default:
                        return false;
                }
            }

            isPathClear(fromRow, fromCol, toRow, toCol) {
                const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
                const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;
                
                let row = fromRow + rowStep;
                let col = fromCol + colStep;
                
                while (row !== toRow || col !== toCol) {
                    if (this.board[row][col]) return false;
                    row += rowStep;
                    col += colStep;
                }
                
                return true;
            }

            makeMove(fromRow, fromCol, toRow, toCol) {
                const piece = this.board[fromRow][fromCol];
                const targetPiece = this.board[toRow][toCol];
                
                // Execute move
                this.board[toRow][toCol] = piece;
                this.board[fromRow][fromCol] = null;
                
                const move = {
                    from: { row: fromRow, col: fromCol },
                    to: { row: toRow, col: toCol },
                    piece: piece,
                    captured: targetPiece,
                    notation: this.getMoveNotation(piece, fromRow, fromCol, toRow, toCol, targetPiece)
                };
                
                this.moveHistory.push(move);
                this.updateMoveHistory(move.notation);
                
                this.updateStatus(`Move played: ${move.notation}`);
                
                // Switch turns
                this.currentTurn = this.currentTurn === 'white' ? 'black' : 'white';
                
                this.renderBoard();
                
                // Simple AI move
                if (this.currentTurn === 'black') {
                    setTimeout(() => this.makeAIMove(), 1000);
                }
            }

            getMoveNotation(piece, fromRow, fromCol, toRow, toCol, captured) {
                const files = 'abcdefgh';
                const pieceSymbol = piece.toLowerCase() === 'p' ? '' : piece.toUpperCase();
                const capture = captured ? 'x' : '';
                return `${pieceSymbol}${files[fromCol]}${8 - fromRow}${capture}${files[toCol]}${8 - toRow}`;
            }

            updateMoveHistory(notation) {
                const moveList = document.getElementById('moveList');
                const moveNumber = Math.floor(this.moveHistory.length / 2) + 1;
                const isWhite = this.moveHistory.length % 2 === 1;
                
                if (isWhite) {
                    moveList.innerHTML += `<div style="padding: 2px 0;">${moveNumber}. ${notation}</div>`;
                } else {
                    moveList.innerHTML += `<div style="padding: 2px 0;"> ${notation}</div>`;
                }
                
                moveList.scrollTop = moveList.scrollHeight;
            }

            makeAIMove() {
                const moves = this.getAllValidMoves('black');
                if (moves.length === 0) return;
                
                const selectedMove = moves[Math.floor(Math.random() * moves.length)];
                this.makeMove(selectedMove.from.row, selectedMove.from.col, selectedMove.to.row, selectedMove.to.col);
            }

            getAllValidMoves(color) {
                const moves = [];
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const piece = this.board[row][col];
                        if (piece) {
                            const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                            if (pieceColor === color) {
                                for (let toRow = 0; toRow < 8; toRow++) {
                                    for (let toCol = 0; toCol < 8; toCol++) {
                                        if (this.isValidMove(row, col, toRow, toCol)) {
                                            moves.push({ from: { row, col }, to: { row: toRow, col: toCol } });
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
                return moves;
            }

            updateStatus(message) {
                document.getElementById('status').textContent = message;
            }

            reset() {
                this.board = this.initializeBoard();
                this.currentTurn = 'white';
                this.selectedSquare = null;
                this.moveHistory = [];
                document.getElementById('moveList').innerHTML = 'No moves yet';
                this.renderBoard();
                this.updateStatus('Game reset - White to move');
            }
        }

        // Global game instance
        let game = null;

        function startNewGame() {
            updateTestStatus('Starting new game...', 'info');
            try {
                game = new SimpleChessEngine();
                game.renderBoard();
                game.updateStatus('Game started - White to move');
                updateTestStatus('✅ Game started successfully', 'success');
            } catch (error) {
                updateTestStatus(`❌ Failed to start game: ${error.message}`, 'error');
            }
        }

        function undoMove() {
            if (game && game.moveHistory.length >= 2) {
                game.moveHistory.pop();
                game.moveHistory.pop();
                // Simple undo - would need more complex logic for full implementation
                game.updateStatus('Move undone');
            }
        }

        function resetGame() {
            if (game) {
                game.reset();
                updateTestStatus('✅ Game reset', 'success');
            }
        }

        // Initialize
        window.onload = function() {
            updateTestStatus('✅ Pure JavaScript Chess App Ready', 'success');
        };
    </script>
</body>
</html>
