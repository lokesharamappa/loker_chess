<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Master Pro - Chess.com Style</title>
  <link rel="stylesheet" href="./style-chesscom.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1 class="logo">♟️ Chess Master Pro</h1>
    </div>
    <div class="header-center">
      <div class="header-title">Chess Master Pro</div>
    </div>
    <div class="header-right">
      <button class="header-btn" id="settingsBtn">⚙️ Settings</button>
      <button class="header-btn" id="profileBtn">👤 Profile</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Left Panel - Game Info -->
    <div class="left-panel">
      <!-- Player Cards -->
      <div class="player-card" id="whitePlayer">
        <div class="player-info">
          <div class="player-avatar">♔</div>
          <div class="player-details">
            <div class="player-name">White</div>
            <div class="player-rating">1200</div>
          </div>
        </div>
        <div class="player-time" id="whiteTime">10:00</div>
      </div>

      <div class="player-card" id="blackPlayer">
        <div class="player-info">
          <div class="player-avatar">♚</div>
          <div class="player-details">
            <div class="player-name">Black</div>
            <div class="player-rating">1200</div>
          </div>
        </div>
        <div class="player-time" id="blackTime">10:00</div>
      </div>

      <!-- Game Status -->
      <div class="game-status">
        <div class="status-text" id="gameStatus">Game in progress</div>
        <div class="move-count" id="moveCount">0 moves</div>
      </div>

      <!-- Settings -->
      <div class="settings-card">
        <div class="setting-row">
          <span class="setting-label">Theme</span>
          <div class="setting-control">
            <select class="select-control" id="themeSelect">
              <option value="classic">Classic</option>
              <option value="wood">Wood</option>
              <option value="green">Green</option>
              <option value="gray">Gray</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Board Size</span>
          <div class="setting-control">
            <select class="select-control" id="sizeSelect">
              <option value="480">Small</option>
              <option value="560" selected>Medium</option>
              <option value="640">Large</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Sound</span>
          <div class="setting-control">
            <input type="checkbox" class="checkbox-control" id="soundToggle" checked>
          </div>
        </div>
      </div>
    </div>

    <!-- Center Panel - Board -->
    <div class="center-panel">
      <div class="board-container">
        <div id="board"></div>
      </div>
      <div class="board-controls">
        <button class="board-btn" id="newGameBtn">New Game</button>
        <button class="board-btn" id="resignBtn">Resign</button>
        <button class="board-btn" id="analysisBtn">Analysis</button>
        <button class="board-btn" id="downloadBtn">Download PGN</button>
      </div>
    </div>

    <!-- Right Panel - Moves, Analysis, Chat -->
    <div class="right-panel">
      <!-- Moves List -->
      <div class="moves-card">
        <div class="card-header">
          <h3>Moves</h3>
          <div class="move-controls">
            <button class="move-btn" id="flipBoardBtn">↻ Flip</button>
          </div>
        </div>
        <div class="moves-list" id="movesList">
          <!-- Moves will be populated here -->
        </div>
      </div>

      <!-- Analysis Card -->
      <div class="analysis-card">
        <div class="card-header">
          <h3>Analysis</h3>
        </div>
        <div class="analysis-content">
          <div class="eval-bar">
            <div class="eval-fill" id="evalBar"></div>
          </div>
          <div class="eval-text" id="evalText">0.0</div>
          <div class="analysis-info" id="analysisInfo">Position is equal</div>
        </div>
      </div>

      <!-- Chat Card -->
      <div class="chat-card">
        <div class="card-header">
          <h3>Chat</h3>
        </div>
        <div class="chat-messages" id="chatMessages">
          <!-- Chat messages will appear here -->
        </div>
        <div class="chat-input-container">
          <input type="text" class="chat-input" id="chatInput" placeholder="Type a message...">
          <button class="chat-send-btn" id="chatSendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lobby Modal -->
  <div class="lobby-container" id="lobbyContainer">
    <div class="lobby-card">
      <div class="lobby-header">
        <h2>Chess Master Pro</h2>
        <p>Choose your game mode</p>
      </div>
      
      <div class="lobby-section">
        <h3>Online Play</h3>
        <input type="text" class="lobby-input" id="roomInput" placeholder="Enter room ID (e.g., game123)">
        
        <div class="lobby-buttons">
          <button class="lobby-btn primary" id="joinRoomBtn">Create / Join Room</button>
          <button class="lobby-btn secondary" id="spectateBtn">Spectate</button>
        </div>
      </div>

      <div class="lobby-section">
        <h3>Computer Play</h3>
        <div class="cpu-options">
          <button class="lobby-btn secondary" id="cpuWhiteBtn">Play vs Computer (White)</button>
          <button class="lobby-btn secondary" id="cpuBlackBtn">Play vs Computer (Black)</button>
        </div>

        <div style="margin-top: 24px;">
          <label class="setting-label">Computer Difficulty</label>
          <select class="select-control" id="difficultySelect" style="width: 100%; margin-top: 8px;">
            <option value="1">Easy (Beginner)</option>
            <option value="2" selected>Medium (Intermediate)</option>
            <option value="3">Hard (Advanced)</option>
            <option value="4">Expert (Master)</option>
            <option value="5">Grandmaster</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastStack"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  
  <!-- Resilient loader to ensure chess.js is present -->
  <script>
    (function ensureChessJs() {
      if (typeof window.Chess === 'function') {
        console.log('Chess.js already loaded');
        return;
      }
      var urls = [
        'https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js',
        './vendor/chess.min.js'
      ];
      function loadNext(i) {
        if (i >= urls.length) { 
          console.error('Failed to load chess.js from all sources'); 
          return; 
        }
        console.log(`Loading chess.js from: ${urls[i]}`);
        var s = document.createElement('script');
        s.src = urls[i];
        s.onload = function() { 
          console.log('Chess.js loaded successfully');
          if (typeof window.Chess !== 'function') loadNext(i+1); 
        };
        s.onerror = function() { 
          console.log(`Failed to load from: ${urls[i]}`);
          loadNext(i+1); 
        };
        document.head.appendChild(s);
      }
      loadNext(0);
    })();
  </script>
  
  <script>
    // Wait for all dependencies to load before initializing
    window.addEventListener('load', function() {
      console.log('Page fully loaded');
      
      // Check if all dependencies are available
      setTimeout(function() {
        if (typeof window.Chess === 'function' && typeof window.ChessBoard === 'function') {
          console.log('All dependencies loaded, initializing...');
          // Load the improved client
          var script = document.createElement('script');
          script.src = './client-improved.js';
          script.onload = function() {
            console.log('Client script loaded successfully');
          };
          script.onerror = function() {
            console.error('Failed to load client script');
          };
          document.head.appendChild(script);
        } else {
          console.error('Dependencies not loaded:', {
            Chess: typeof window.Chess,
            ChessBoard: typeof window.ChessBoard
          });
        }
      }, 500);
    });
  </script>
</body>
</html>
