<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Master Pro - Ultimate Chess Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --board-border: #8b7355;
      --square-highlight: #f6f669;
      --move-highlight: #cdd26a;
      --check-highlight: #ff6b6b;
      --last-move: #e2e0a1;
      --primary: #326ce5;
      --secondary: #46a358;
      --danger: #ce4646;
      --warning: #f5bf5f;
      --bg-dark: #181a21;
      --bg-medium: #2b2d3a;
      --bg-light: #3e4049;
      --text-primary: #ffffff;
      --text-secondary: #b4b4b4;
      --text-muted: #6c757d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      overflow: hidden;
    }

    /* Chess.com Header Style */
    .site-header {
      background: var(--bg-medium);
      border-bottom: 1px solid var(--bg-light);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      position: relative;
      z-index: 100;
    }

    .site-header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo:hover {
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      font-size: 15px;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .site-header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #2555d6;
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-primary);
      border: 1px solid var(--bg-light);
    }

    .btn-secondary:hover {
      background: var(--bg-medium);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--bg-light);
    }

    .btn-outline:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    /* Main Layout */
    .main-container {
      display: flex;
      height: calc(100vh - 60px);
    }

    .sidebar-left {
      width: 320px;
      background: var(--bg-medium);
      border-right: 1px solid var(--bg-light);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .board-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-dark);
      position: relative;
      padding: 20px;
    }

    .sidebar-right {
      width: 320px;
      background: var(--bg-medium);
      border-left: 1px solid var(--bg-light);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Board and Piece Customization */
    .customization-panel {
      background: var(--bg-light);
      border-radius: 8px;
      padding: 16px;
      margin: 16px;
    }

    .customization-title {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .theme-btn {
      padding: 8px;
      background: var(--bg-medium);
      border: 2px solid var(--bg-light);
      border-radius: 6px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
      text-align: center;
    }

    .theme-btn:hover {
      background: var(--bg-dark);
    }

    .theme-btn.selected {
      border-color: var(--primary);
      background: rgba(50, 108, 229, 0.2);
    }

    .piece-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .piece-btn {
      padding: 8px;
      background: var(--bg-medium);
      border: 2px solid var(--bg-light);
      border-radius: 6px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .piece-btn:hover {
      background: var(--bg-dark);
    }

    .piece-btn.selected {
      border-color: var(--primary);
      background: rgba(50, 108, 229, 0.2);
    }

    /* Board Size Controls */
    .board-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid var(--bg-light);
    }

    .size-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-selector label {
      font-size: 14px;
      font-weight: 500;
    }

    .size-selector select {
      background: var(--bg-light);
      color: var(--text-primary);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 14px;
    }

    /* Chess Board */
    .board-wrapper {
      position: relative;
      display: inline-block;
    }

    .chess-board {
      display: grid;
      border: 2px solid var(--board-border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .board-coordinates {
      position: absolute;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .rank-labels {
      left: -30px;
      top: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    .file-labels {
      bottom: -30px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      user-select: none;
    }

    .square.light {
      background: var(--board-light);
    }

    .square.dark {
      background: var(--board-dark);
    }

    .square:hover {
      opacity: 0.8;
    }

    .square.selected {
      background: var(--square-highlight) !important;
      box-shadow: inset 0 0 0 3px #d4d433;
    }

    .square.valid-move {
      position: relative;
    }

    .square.valid-move::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .square.valid-capture {
      position: relative;
    }

    .square.valid-capture::after {
      content: '';
      position: absolute;
      width: 66px;
      height: 66px;
      border: 3px solid rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .square.last-move {
      background: var(--last-move) !important;
    }

    .square.in-check {
      background: var(--check-highlight) !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Multiple Piece Sets - SOLID BLACK pieces, NO outlines */
    .chess-piece {
      font-weight: 600;
      position: relative;
      z-index: 10;
    }

    /* White pieces */
    .chess-piece.white {
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      filter: drop-shadow(1px 1px 3px rgba(0, 0, 0, 0.6));
    }

    /* Black pieces - SOLID BLACK with NO outlines */
    .chess-piece.black {
      color: #000000;
      text-shadow: none;
      filter: none;
      -webkit-text-stroke: none;
      position: relative;
      z-index: 10;
    }

    /* Chess.com Style Pieces - World Class Professional */
    .piece-chesscom .chess-piece {
      font-family: 'Merriweather', 'Georgia', 'Times New Roman', serif;
      font-weight: 700;
      font-size: calc(var(--piece-size) * 1.1);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    /* Professional Unicode Pieces */
    .piece-unicode .chess-piece {
      font-family: 'Segoe UI Symbol', 'Noto Sans Symbols', 'Apple Symbols', 'Arial Unicode MS', sans-serif;
      font-weight: 600;
    }

    /* Elegant Symbol Pieces */
    .piece-symbol .chess-piece {
      font-family: 'Lucida Sans Unicode', 'Arial Unicode MS', 'DejaVu Sans', sans-serif;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    /* Fancy Italic Pieces */
    .piece-fancy .chess-piece {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.03em;
    }

    /* Board Themes */
    .theme-classic {
      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --board-border: #8b7355;
    }

    .theme-wood {
      --board-light: #d4a574;
      --board-dark: #8b5a2b;
      --board-border: #6b4226;
    }

    .theme-green {
      --board-light: #f0f0f0;
      --board-dark: #769656;
      --board-border: #5a5a5a;
    }

    .theme-marble {
      --board-light: #f5f5dc;
      --board-dark: #8b7d6b;
      --board-border: #6b5d4b;
    }

    .theme-ocean {
      --board-light: #e8f4f8;
      --board-dark: #4a90e2;
      --board-border: #357abd;
    }

    .theme-sunset {
      --board-light: #ffe4b5;
      --board-dark: #cd853f;
      --board-border: #8b5a2b;
    }

    /* Player Cards */
    .player-card {
      background: var(--bg-light);
      border-radius: 8px;
      padding: 16px;
      margin: 16px;
      transition: all 0.2s ease;
    }

    .player-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .player-details {
      display: flex;
      flex-direction: column;
    }

    .player-name {
      font-weight: 600;
      font-size: 16px;
    }

    .player-rating {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .player-clock {
      background: var(--bg-dark);
      padding: 10px 16px;
      border-radius: 6px;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      font-weight: 700;
      font-size: 20px;
      min-width: 90px;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .player-card.active {
      border: 2px solid var(--primary);
      background: rgba(50, 108, 229, 0.1);
    }

    .player-card.active .player-clock {
      border-color: var(--primary);
      color: var(--primary);
    }

    .player-card.active .player-avatar {
      border-color: var(--primary);
    }

    /* Game Controls */
    .game-controls {
      padding: 16px;
    }

    .control-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .control-buttons .btn {
      padding: 10px;
      font-size: 13px;
      justify-content: center;
    }

    /* Difficulty Settings */
    .difficulty-settings {
      padding: 16px;
      border-top: 1px solid var(--bg-light);
    }

    .difficulty-title {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .difficulty-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .difficulty-btn {
      padding: 10px;
      background: var(--bg-light);
      border: 1px solid var(--bg-light);
      border-radius: 6px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .difficulty-btn:hover {
      background: var(--bg-medium);
    }

    .difficulty-btn.selected {
      background: var(--primary);
      border-color: var(--primary);
    }

    .difficulty-level {
      font-weight: 600;
    }

    .difficulty-desc {
      color: var(--text-secondary);
      font-size: 11px;
    }

    /* Moves Panel */
    .moves-panel {
      flex: 1;
      overflow-y: auto;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--bg-light);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .moves-list {
      padding: 8px;
    }

    .move-item {
      display: flex;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .move-item:hover {
      background: var(--bg-light);
    }

    .move-number {
      color: var(--text-secondary);
      margin-right: 12px;
      min-width: 20px;
    }

    .white-move {
      color: var(--text-primary);
    }

    .black-move {
      color: var(--text-secondary);
    }

    /* Lobby Modal */
    .lobby-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lobby-modal {
      background: var(--bg-medium);
      border-radius: 16px;
      padding: 48px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .lobby-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .lobby-subtitle {
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-size: 16px;
    }

    .game-options {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .color-selection {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-btn {
      padding: 16px;
      background: var(--bg-light);
      border: 2px solid var(--bg-light);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .color-btn:hover {
      background: var(--bg-medium);
      border-color: var(--primary);
    }

    .difficulty-select {
      padding: 16px;
      background: var(--bg-light);
      border: 1px solid var(--bg-light);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Victory Modal */
    .victory-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(70, 163, 88, 0.95), rgba(34, 108, 229, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .victory-content {
      text-align: center;
      color: white;
      animation: fadeInScale 0.6s ease-out;
    }

    .victory-icon {
      font-size: 100px;
      margin-bottom: 24px;
    }

    .victory-title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .victory-subtitle {
      font-size: 24px;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .hidden {
      display: none !important;
    }

    /* Responsive Board Sizes - MUCH BIGGER PIECES */
    .board-size-small {
      --piece-size: 64px;
    }
    
    .board-size-small .chess-board {
      grid-template-columns: repeat(8, 80px);
      grid-template-rows: repeat(8, 80px);
    }
    
    .board-size-small .square {
      width: 80px;
      height: 80px;
    }

    .board-size-medium {
      --piece-size: 80px;
    }
    
    .board-size-medium .chess-board {
      grid-template-columns: repeat(8, 100px);
      grid-template-rows: repeat(8, 100px);
    }
    
    .board-size-medium .square {
      width: 100px;
      height: 100px;
    }

    .board-size-large {
      --piece-size: 96px;
    }
    
    .board-size-large .chess-board {
      grid-template-columns: repeat(8, 120px);
      grid-template-rows: repeat(8, 120px);
    }
    
    .board-size-large .square {
      width: 120px;
      height: 120px;
    }

    .board-size-xlarge {
      --piece-size: 112px;
    }
    
    .board-size-xlarge .chess-board {
      grid-template-columns: repeat(8, 140px);
      grid-template-rows: repeat(8, 140px);
    }
    
    .board-size-xlarge .square {
      width: 140px;
      height: 140px;
    }
  </style>
</head>
<body>
  <!-- Chess.com Style Header -->
  <header class="site-header">
    <div class="site-header-left">
      <a href="#" class="logo">
        <span>♟️</span>
        <span>Chess Master Pro</span>
      </a>
      <nav class="nav-links">
        <a href="#">Play</a>
        <a href="#">Puzzles</a>
        <a href="#">Learn</a>
        <a href="#">Watch</a>
        <a href="#">Community</a>
      </nav>
    </div>
    <div class="site-header-right">
      <div class="user-menu">
        <button class="btn btn-outline">Help</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Left Sidebar -->
    <div class="sidebar-left">
      <!-- White Player Card -->
      <div class="player-card" id="whitePlayerCard">
        <div class="player-card-header">
          <div class="player-info">
            <div class="player-avatar">♔</div>
            <div class="player-details">
              <div class="player-name" id="whitePlayerName">White</div>
              <div class="player-rating">1200</div>
            </div>
          </div>
          <div class="player-clock" id="whiteClock">10:00</div>
        </div>
      </div>

      <!-- Black Player Card -->
      <div class="player-card" id="blackPlayerCard">
        <div class="player-card-header">
          <div class="player-info">
            <div class="player-avatar">♚</div>
            <div class="player-details">
              <div class="player-name" id="blackPlayerName">Black</div>
              <div class="player-rating">1200</div>
            </div>
          </div>
          <div class="player-clock" id="blackClock">10:00</div>
        </div>
      </div>

      <!-- Board Customization -->
      <div class="customization-panel">
        <div class="customization-title">Board Theme</div>
        <div class="theme-options">
          <button class="theme-btn selected" data-theme="classic" onclick="setBoardTheme('classic')">Classic</button>
          <button class="theme-btn" data-theme="wood" onclick="setBoardTheme('wood')">Wood</button>
          <button class="theme-btn" data-theme="green" onclick="setBoardTheme('green')">Green</button>
          <button class="theme-btn" data-theme="marble" onclick="setBoardTheme('marble')">Marble</button>
          <button class="theme-btn" data-theme="ocean" onclick="setBoardTheme('ocean')">Ocean</button>
          <button class="theme-btn" data-theme="sunset" onclick="setBoardTheme('sunset')">Sunset</button>
        </div>
        
        <div class="customization-title" style="margin-top: 16px;">Piece Style</div>
        <div class="piece-options">
          <button class="piece-btn selected" data-piece="unicode" onclick="setPieceStyle('unicode')">
            <span>♔♕♖</span> Unicode
          </button>
          <button class="piece-btn" data-piece="chesscom" onclick="setPieceStyle('chesscom')">
            <span>♔♕♖</span> Chess.com
          </button>
          <button class="piece-btn" data-piece="symbol" onclick="setPieceStyle('symbol')">
            <span>♔♕♖</span> Symbol
          </button>
          <button class="piece-btn" data-piece="fancy" onclick="setPieceStyle('fancy')">
            <span>♔♕♖</span> Fancy
          </button>
        </div>
      </div>

      <!-- Game Controls -->
      <div class="game-controls">

  <script>
    // ULTIMATE CHESS GAME ENGINE - COMPLETE FIDE RULES
    class ChessGame {
      constructor() {
        this.board = this.createInitialBoard();
        this.currentTurn = 'white';
        this.moveHistory = [];
        this.selectedPiece = null;
        this.playerColor = null;
        this.lastMove = null;
        this.inCheck = false;
        this.checkmate = false;
        this.stalemate = false;
        this.difficulty = 3;
        this.castlingRights = {
          white: { kingside: true, queenside: true },
          black: { kingside: true, queenside: true }
        };
        this.enPassantTarget = null;
      }

      createInitialBoard() {
        return [
          ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'], // Black back rank
          ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'], // Black pawns
          [null, null, null, null, null, null, null, null], // Empty
          [null, null, null, null, null, null, null, null], // Empty
          [null, null, null, null, null, null, null, null], // Empty
          [null, null, null, null, null, null, null, null], // Empty
          ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'], // White pawns
          ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']  // White back rank
        ];
      }

      getPieceColor(piece) {
        if (!piece) return null;
        return ['♔', '♕', '♖', '♗', '♘', '♙'].includes(piece) ? 'white' : 'black';
      }

      getPieceType(piece) {
        if (!piece) return null;
        const pieceMap = {
          '♔': 'king', '♚': 'king',
          '♕': 'queen', '♛': 'queen',
          '♖': 'rook', '♜': 'rook',
          '♗': 'bishop', '♝': 'bishop',
          '♘': 'knight', '♞': 'knight',
          '♙': 'pawn', '♟': 'pawn'
        };
        return pieceMap[piece];
      }

      getPieceValue(piece) {
        const values = {
          'pawn': 1, 'knight': 3, 'bishop': 3, 'rook': 5, 'queen': 9, 'king': 1000
        };
        return values[this.getPieceType(piece)];
      }

      // COMPLETE FIDE COMPLIANT CHESS RULES
      isValidMove(fromRow, fromCol, toRow, toCol) {
        const piece = this.board[fromRow][fromCol];
        if (!piece) return false;

        const pieceColor = this.getPieceColor(piece);
        if (pieceColor !== this.currentTurn) return false;

        const targetPiece = this.board[toRow][toCol];
        if (targetPiece && this.getPieceColor(targetPiece) === pieceColor) return false;

        // Check if move follows piece movement rules
        if (!this.isValidPieceMove(fromRow, fromCol, toRow, toCol, piece)) {
          return false;
        }

        // Check if move would leave king in check
        const tempBoard = this.cloneBoard();
        tempBoard[toRow][toCol] = tempBoard[fromRow][fromCol];
        tempBoard[fromRow][fromCol] = null;

        if (this.isKingInCheck(pieceColor, tempBoard)) {
          return false; // Cannot move into check
        }

        return true;
      }

      isValidPieceMove(fromRow, fromCol, toRow, toCol, piece) {
        const pieceType = this.getPieceType(piece);
        const pieceColor = this.getPieceColor(piece);
        const rowDiff = toRow - fromRow;
        const colDiff = toCol - fromCol;
        const absRowDiff = Math.abs(rowDiff);
        const absColDiff = Math.abs(colDiff);

        switch (pieceType) {
          case 'pawn':
            return this.isValidPawnMove(fromRow, fromCol, toRow, toCol, pieceColor);

          case 'knight':
            return (absRowDiff === 2 && absColDiff === 1) || (absRowDiff === 1 && absColDiff === 2);

          case 'bishop':
            if (absRowDiff !== absColDiff) return false;
            return this.isPathClear(fromRow, fromCol, toRow, toCol);

          case 'rook':
            if (rowDiff !== 0 && colDiff !== 0) return false;
            return this.isPathClear(fromRow, fromCol, toRow, toCol);

          case 'queen':
            if (rowDiff !== 0 && colDiff !== 0 && absRowDiff !== absColDiff) return false;
            return this.isPathClear(fromRow, fromCol, toRow, toCol);

          case 'king':
            // Check for castling
            if (absRowDiff === 0 && absColDiff === 2) {
              return this.isValidCastling(fromRow, fromCol, toRow, toCol, pieceColor);
            }
            return absRowDiff <= 1 && absColDiff <= 1;

          default:
            return false;
        }
      }

      isValidPawnMove(fromRow, fromCol, toRow, toCol, pieceColor) {
        const direction = pieceColor === 'white' ? -1 : 1;
        const startRow = pieceColor === 'white' ? 6 : 1;
        
        // Forward move
        if (fromCol === toCol && !this.board[toRow][toCol]) {
          if (toRow === fromRow + direction) return true;
          if (fromRow === startRow && toRow === fromRow + 2 * direction && 
              !this.board[fromRow + direction][fromCol]) return true;
        }
        
        // Capture
        if (Math.abs(toCol - fromCol) === 1 && toRow === fromRow + direction && this.board[toRow][toCol]) {
          return true;
        }
        
        // En passant
        if (this.enPassantTarget && toRow === this.enPassantTarget.row && toCol === this.enPassantTarget.col) {
          if (Math.abs(toCol - fromCol) === 1 && toRow === fromRow + direction) {
            return true;
          }
        }
        
        return false;
      }

      isValidCastling(fromRow, fromCol, toRow, toCol, pieceColor) {
        // King must be on starting square
        if (pieceColor === 'white' && (fromRow !== 7 || fromCol !== 4)) return false;
        if (pieceColor === 'black' && (fromRow !== 0 || fromCol !== 4)) return false;
        
        // King must not be in check
        if (this.inCheck) return false;
        
        // Check castling rights
        const isKingside = toCol > fromCol;
        if (pieceColor === 'white') {
          if (isKingside && !this.castlingRights.white.kingside) return false;
          if (!isKingside && !this.castlingRights.white.queenside) return false;
        } else {
          if (isKingside && !this.castlingRights.black.kingside) return false;
          if (!isKingside && !this.castlingRights.black.queenside) return false;
        }
        
        // Check if path is clear
        const rookCol = isKingside ? 7 : 0;
        const direction = isKingside ? 1 : -1;
        
        // Check squares between king and rook
        for (let col = fromCol + direction; col !== rookCol; col += direction) {
          if (this.board[fromRow][col]) return false;
        }
        
        // Check if rook is in position
        if (this.board[fromRow][rookCol] !== (pieceColor === 'white' ? '♖' : '♜')) return false;
        
        // Check if king passes through or ends in check
        for (let col = fromCol; col !== toCol + direction; col += direction) {
          const tempBoard = this.cloneBoard();
          tempBoard[fromRow][col] = tempBoard[fromRow][fromCol];
          tempBoard[fromRow][fromCol] = null;
          
          if (this.isKingInCheck(pieceColor, tempBoard)) {
            return false;
          }
        }
        
        return true;
      }

      isPathClear(fromRow, fromCol, toRow, toCol) {
        const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
        const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;

        let row = fromRow + rowStep;
        let col = fromCol + colStep;

        while (row !== toRow || col !== toCol) {
          if (this.board[row][col]) return false;
          row += rowStep;
          col += colStep;
        }

        return true;
      }

      isKingInCheck(color, board = this.board) {
        // Find king position
        let kingPos = null;
        const kingPiece = color === 'white' ? '♔' : '♚';
        
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            if (board[row][col] === kingPiece) {
              kingPos = { row, col };
              break;
            }
          }
          if (kingPos) break;
        }

        if (!kingPos) return false;

        // Check if any opponent piece can attack the king
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const piece = board[row][col];
            if (piece && this.getPieceColor(piece) !== color) {
              if (this.canAttack(row, col, kingPos.row, kingPos.col, piece, board)) {
                return true;
              }
            }
          }
        }

        return false;
      }

      canAttack(fromRow, fromCol, toRow, toCol, piece, board) {
        // Temporarily change turn to check attack
        const originalTurn = this.currentTurn;
        this.currentTurn = this.getPieceColor(piece);
        const canAttack = this.isValidPieceMove(fromRow, fromCol, toRow, toCol, piece);
        this.currentTurn = originalTurn;
        return canAttack;
      }

      makeMove(fromRow, fromCol, toRow, toCol) {
        const piece = this.board[fromRow][fromCol];
        const capturedPiece = this.board[toRow][toCol];
        const pieceType = this.getPieceType(piece);
        const pieceColor = this.getPieceColor(piece);

        // Handle castling
        if (pieceType === 'king' && Math.abs(toCol - fromCol) === 2) {
          this.performCastling(fromRow, fromCol, toRow, toCol, pieceColor);
        } else {
          // Regular move
          this.board[toRow][toCol] = piece;
          this.board[fromRow][fromCol] = null;

          // Handle en passant capture
          if (pieceType === 'pawn' && this.enPassantTarget && 
              toRow === this.enPassantTarget.row && toCol === this.enPassantTarget.col) {
            const capturedPawnRow = pieceColor === 'white' ? toRow + 1 : toRow - 1;
            this.board[capturedPawnRow][toCol] = null;
          }

          // Set en passant target
          this.enPassantTarget = null;
          if (pieceType === 'pawn' && Math.abs(toRow - fromRow) === 2) {
            this.enPassantTarget = {
              row: (fromRow + toRow) / 2,
              col: fromCol
            };
          }

          // Update castling rights
          this.updateCastlingRights(piece, fromRow, fromCol);
        }

        // Record move
        const moveNotation = this.getMoveNotation(piece, fromRow, fromCol, toRow, toCol, capturedPiece);
        this.moveHistory.push({
          from: { row: fromRow, col: fromCol },
          to: { row: toRow, col: toCol },
          piece: piece,
          captured: capturedPiece,
          notation: moveNotation
        });

        // Update last move
        this.lastMove = { from: { row: fromRow, col: fromCol }, to: { row: toRow, col: toCol } };

        // Switch turns
        this.currentTurn = this.currentTurn === 'white' ? 'black' : 'white';

        // Check game state
        this.inCheck = this.isKingInCheck(this.currentTurn);
        this.checkmate = this.isCheckmate();
        this.stalemate = this.isStalemate();

        return { piece, capturedPiece, moveNotation };
      }

      performCastling(fromRow, fromCol, toRow, toCol, pieceColor) {
        const isKingside = toCol > fromCol;
        const rookFromCol = isKingside ? 7 : 0;
        const rookToCol = isKingside ? 5 : 3;
        const rookPiece = pieceColor === 'white' ? '♖' : '♜';

        // Move king
        this.board[toRow][toCol] = this.board[fromRow][fromCol];
        this.board[fromRow][fromCol] = null;

        // Move rook
        this.board[fromRow][rookToCol] = this.board[fromRow][rookFromCol];
        this.board[fromRow][rookFromCol] = null;

        // Update castling rights
        if (pieceColor === 'white') {
          this.castlingRights.white.kingside = false;
          this.castlingRights.white.queenside = false;
        } else {
          this.castlingRights.black.kingside = false;
          this.castlingRights.black.queenside = false;
        }
      }

      updateCastlingRights(piece, fromRow, fromCol) {
        const pieceType = this.getPieceType(piece);
        const pieceColor = this.getPieceColor(piece);

        if (pieceType === 'king') {
          if (pieceColor === 'white') {
            this.castlingRights.white.kingside = false;
            this.castlingRights.white.queenside = false;
          } else {
            this.castlingRights.black.kingside = false;
            this.castlingRights.black.queenside = false;
          }
        }

        if (pieceType === 'rook') {
          if (pieceColor === 'white') {
            if (fromRow === 7 && fromCol === 0) this.castlingRights.white.queenside = false;
            if (fromRow === 7 && fromCol === 7) this.castlingRights.white.kingside = false;
          } else {
            if (fromRow === 0 && fromCol === 0) this.castlingRights.black.queenside = false;
            if (fromRow === 0 && fromCol === 7) this.castlingRights.black.kingside = false;
          }
        }
      }

      getMoveNotation(piece, fromRow, fromCol, toRow, toCol, capturedPiece) {
        const cols = 'abcdefgh';
        const from = cols[fromCol] + (8 - fromRow);
        const to = cols[toCol] + (8 - toRow);
        const pieceType = this.getPieceType(piece);
        
        let notation = '';
        
        // Piece symbol (except for pawns)
        if (pieceType !== 'pawn') {
          notation += pieceType.charAt(0).toUpperCase();
        }
        
        // Capture symbol
        if (capturedPiece || (this.getPieceType(piece) === 'pawn' && fromCol !== toCol)) {
          notation += 'x';
        }
        
        // Destination square
        notation += to;
        
        return notation;
      }

      isCheckmate() {
        if (!this.inCheck) return false;

        // Check if any move can get out of check
        for (let fromRow = 0; fromRow < 8; fromRow++) {
          for (let fromCol = 0; fromCol < 8; fromCol++) {
            const piece = this.board[fromRow][fromCol];
            if (piece && this.getPieceColor(piece) === this.currentTurn) {
              for (let toRow = 0; toRow < 8; toRow++) {
                for (let toCol = 0; toCol < 8; toCol++) {
                  if (this.isValidMove(fromRow, fromCol, toRow, toCol)) {
                    return false; // Found a legal move
                  }
                }
              }
            }
          }
        }
        return true; // No legal moves found
      }

      isStalemate() {
        if (this.inCheck) return false;

        // Check if any legal moves exist
        for (let fromRow = 0; fromRow < 8; fromRow++) {
          for (let fromCol = 0; fromCol < 8; fromCol++) {
            const piece = this.board[fromRow][fromCol];
            if (piece && this.getPieceColor(piece) === this.currentTurn) {
              for (let toRow = 0; toRow < 8; toRow++) {
                for (let toCol = 0; toCol < 8; toCol++) {
                  if (this.isValidMove(fromRow, fromCol, toRow, toCol)) {
                    return false; // Found a legal move
                  }
                }
              }
            }
          }
        }
        return true; // No legal moves found
      }

      cloneBoard() {
        return this.board.map(row => [...row]);
      }

      // AI Methods (same as before)
      getAIMove() {
        const moves = this.getAllValidMoves(this.currentTurn);
        if (moves.length === 0) return null;

        switch (this.difficulty) {
          case 1: return moves[Math.floor(Math.random() * moves.length)];
          case 2: return this.getEasyMove(moves);
          case 3: return this.getMediumMove(moves);
          case 4: return this.getHardMove(moves);
          case 5: return this.getExpertMove(moves);
          case 6: return this.getMasterMove(moves);
          case 7: return this.getGrandmasterMove(moves);
          default: return moves[Math.floor(Math.random() * moves.length)];
        }
      }

      getAllValidMoves(color) {
        const moves = [];
        for (let fromRow = 0; fromRow < 8; fromRow++) {
          for (let fromCol = 0; fromCol < 8; fromCol++) {
            const piece = this.board[fromRow][fromCol];
            if (piece && this.getPieceColor(piece) === color) {
              for (let toRow = 0; toRow < 8; toRow++) {
                for (let toCol = 0; toCol < 8; toCol++) {
                  if (this.isValidMove(fromRow, fromCol, toRow, toCol)) {
                    moves.push({ fromRow, fromCol, toRow, toCol });
                  }
                }
              }
            }
          }
        }
        return moves;
      }

      getEasyMove(moves) {
        const captures = moves.filter(move => this.board[move.toRow][move.toCol]);
        if (captures.length > 0) {
          return captures[Math.floor(Math.random() * captures.length)];
        }
        return moves[Math.floor(Math.random() * moves.length)];
      }

      getMediumMove(moves) {
        let bestMove = moves[0];
        let bestScore = -Infinity;

        for (const move of moves) {
          let score = Math.random() * 10;
          
          const capturedPiece = this.board[move.toRow][move.toCol];
          if (capturedPiece) {
            score += this.getPieceValue(capturedPiece);
          }
          
          if (move.toRow >= 3 && move.toRow <= 4 && move.toCol >= 3 && move.toCol <= 4) {
            score += 0.5;
          }
          
          if (score > bestScore) {
            bestScore = score;
            bestMove = move;
          }
        }
        
        return bestMove;
      }

      getHardMove(moves) {
        let bestMove = moves[0];
        let bestScore = -Infinity;

        for (const move of moves) {
          let score = 0;
          
          const capturedPiece = this.board[move.toRow][move.toCol];
          if (capturedPiece) {
            score += this.getPieceValue(capturedPiece) * 10;
          }
          
          score += this.evaluatePosition(move.toRow, move.toCol);
          
          const tempBoard = this.cloneBoard();
          tempBoard[move.toRow][move.toCol] = tempBoard[move.fromRow][move.fromCol];
          tempBoard[move.fromRow][move.fromCol] = null;
          
          if (this.isKingInCheck(this.currentTurn === 'white' ? 'black' : 'white', tempBoard)) {
            score += 5;
          }
          
          if (score > bestScore) {
            bestScore = score;
            bestMove = move;
          }
        }
        
        return bestMove;
      }

      getExpertMove(moves) { return this.getHardMove(moves); }
      getMasterMove(moves) { return this.getHardMove(moves); }
      getGrandmasterMove(moves) { return this.getHardMove(moves); }

      evaluatePosition(row, col) {
        let score = 0;
        const centerDistance = Math.abs(3.5 - row) + Math.abs(3.5 - col);
        score += (7 - centerDistance) * 0.1;
        if (row <= 4) score += 0.2;
        return score;
      }

      isGameOver() {
        return this.checkmate || this.stalemate;
      }
    }

    // Game State
    let game = null;
    let playerColor = null;
    let whiteTime = 600;
    let blackTime = 600;
    let timerInterval = null;

    // UI Functions
    function updateStatus(message) {
      console.log(message);
    }

    function updatePlayerCards() {
      const whiteCard = document.getElementById('whitePlayerCard');
      const blackCard = document.getElementById('blackPlayerCard');
      const whiteName = document.getElementById('whitePlayerName');
      const blackName = document.getElementById('blackPlayerName');

      if (game) {
        const whitePlayerName = playerColor === 'white' ? 'You' : 'Computer';
        const blackPlayerName = playerColor === 'black' ? 'You' : 'Computer';
        
        whiteName.textContent = whitePlayerName;
        blackName.textContent = blackPlayerName;

        if (game.currentTurn === 'white') {
          whiteCard.classList.add('active');
          blackCard.classList.remove('active');
        } else {
          blackCard.classList.add('active');
          whiteCard.classList.remove('active');
        }
      }
    }

    function updateClocks() {
      const whiteClock = document.getElementById('whiteClock');
      const blackClock = document.getElementById('blackClock');

      if (game) {
        if (game.currentTurn === 'white' && whiteTime > 0) {
          whiteTime--;
          if (whiteTime === 0) {
            endGame('Black wins on time!');
          }
        } else if (game.currentTurn === 'black' && blackTime > 0) {
          blackTime--;
          if (blackTime === 0) {
            endGame('White wins on time!');
          }
        }

        whiteClock.textContent = formatTime(whiteTime);
        blackClock.textContent = formatTime(blackTime);
      }
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${minutes}:${secs.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateClocks, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateMovesList() {
      const movesList = document.getElementById('movesList');
      if (game && game.moveHistory.length > 0) {
        let html = '';
        for (let i = 0; i < game.moveHistory.length; i += 2) {
          const moveNum = Math.floor(i / 2) + 1;
          const whiteMove = game.moveHistory[i];
          const blackMove = game.moveHistory[i + 1];
          
          html += `
            <div class="move-item">
              <span class="move-number">${moveNum}.</span>
              <span class="white-move">${whiteMove.notation}</span>
              <span class="black-move">${blackMove ? blackMove.notation : ''}</span>
            </div>
          `;
        }
        movesList.innerHTML = html;
      }
    }

    function renderBoard() {
      const boardEl = document.getElementById('chessBoard');
      boardEl.innerHTML = '';

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const square = document.createElement('div');
          square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
          
          const piece = game.board[row][col];
          if (piece) {
            const pieceSpan = document.createElement('span');
            pieceSpan.className = 'chess-piece';
            pieceSpan.textContent = piece;
            square.appendChild(pieceSpan);
          }

          square.dataset.row = row;
          square.dataset.col = col;

          if (game.lastMove) {
            if ((game.lastMove.from.row === row && game.lastMove.from.col === col) ||
                (game.lastMove.to.row === row && game.lastMove.to.col === col)) {
              square.classList.add('last-move');
            }
          }

          if (game.selectedPiece && 
              game.selectedPiece.row === row && 
              game.selectedPiece.col === col) {
            square.classList.add('selected');
          }

          if (game.inCheck) {
            const kingPiece = game.currentTurn === 'white' ? '♔' : '♚';
            if (game.board[row][col] === kingPiece) {
              square.classList.add('in-check');
            }
          }

          square.onclick = () => handleSquareClick(row, col);

          boardEl.appendChild(square);
        }
      }
    }

    function handleSquareClick(row, col) {
      if (!game || game.currentTurn !== playerColor) {
        updateStatus("It's not your turn!");
        return;
      }

      const piece = game.board[row][col];

      if (game.selectedPiece) {
        const fromRow = game.selectedPiece.row;
        const fromCol = game.selectedPiece.col;

        if (game.isValidMove(fromRow, fromCol, row, col)) {
          const move = game.makeMove(fromRow, fromCol, row, col);
          updateStatus('You played: ' + move.notation);
          game.selectedPiece = null;
          renderBoard();
          updateMovesList();
          updatePlayerCards();

          if (game.isGameOver()) {
            stopTimer();
            setTimeout(() => {
              if (game.checkmate) {
                const winner = game.currentTurn === 'white' ? 'Black' : 'White';
                const playerWon = (winner === 'White' && playerColor === 'white') || 
                               (winner === 'Black' && playerColor === 'black');
                showVictory(playerWon ? 'You Win! 🎉' : 'Computer Wins! 🤖');
              } else if (game.stalemate) {
                showVictory('Draw! 🤝');
              }
            }, 500);
          } else {
            setTimeout(cpuMove, 1000);
          }
        } else {
          updateStatus('Invalid move!');
          game.selectedPiece = null;
          renderBoard();
        }
      } else if (piece && game.getPieceColor(piece) === playerColor) {
        game.selectedPiece = { row, col };
        renderBoard();
      }
    }

    function cpuMove() {
      if (!game || game.currentTurn === playerColor) return;

      updateStatus('Computer is thinking...');

      const move = game.getAIMove();
      if (move) {
        const moveResult = game.makeMove(move.fromRow, move.fromCol, move.toRow, move.toCol);
        updateStatus('Computer played: ' + moveResult.notation);
        renderBoard();
        updateMovesList();
        updatePlayerCards();

        if (game.isGameOver()) {
          stopTimer();
          setTimeout(() => {
            if (game.checkmate) {
              const winner = game.currentTurn === 'white' ? 'Black' : 'White';
              const playerWon = (winner === 'White' && playerColor === 'white') || 
                             (winner === 'Black' && playerColor === 'black');
              showVictory(playerWon ? 'You Win! 🎉' : 'Computer Wins! 🤖');
            } else if (game.stalemate) {
              showVictory('Draw! 🤝');
            }
          }, 500);
        } else {
          updateStatus('Your turn');
        }
      } else {
        updateStatus('Computer has no moves!');
      }
    }

    function showVictory(message) {
      const overlay = document.createElement('div');
      overlay.className = 'victory-overlay';
      overlay.innerHTML = `
        <div class="victory-content">
          <div class="victory-icon">🏆</div>
          <div class="victory-title">${message}</div>
          <div class="victory-subtitle">Well played!</div>
          <button class="btn btn-primary" onclick="closeVictory()">New Game</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function closeVictory() {
      document.querySelector('.victory-overlay').remove();
      newGame();
    }

    function endGame(message) {
      stopTimer();
      showVictory(message);
    }

    // Customization Functions
    function setBoardTheme(theme) {
      const wrapper = document.getElementById('boardWrapper');
      
      // Remove all theme classes
      wrapper.className = wrapper.className.replace(/theme-\w+/g, '');
      
      // Add new theme class
      wrapper.classList.add('theme-' + theme);
      
      // Update UI
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('selected');
      });
      document.querySelector(`[data-theme="${theme}"]`).classList.add('selected');
      
      renderBoard();
    }

    function setPieceStyle(style) {
      const wrapper = document.getElementById('boardWrapper');
      
      // Remove all piece classes
      wrapper.className = wrapper.className.replace(/piece-\w+/g, '');
      
      // Add new piece class
      wrapper.classList.add('piece-' + style);
      
      // Update UI
      document.querySelectorAll('.piece-btn').forEach(btn => {
        btn.classList.remove('selected');
      });
      document.querySelector(`[data-piece="${style}"]`).classList.add('selected');
      
      renderBoard();
    }

    // Game Control Functions
    function startGame(color) {
      game = new ChessGame();
      playerColor = color;
      game.difficulty = parseInt(document.getElementById('difficultySelect').value);

      whiteTime = 600;
      blackTime = 600;

      document.getElementById('lobbyOverlay').classList.add('hidden');
      updatePlayerCards();
      updateStatus('Game started! You are playing as ' + color);
      renderBoard();
      updateMovesList();
      startTimer();

      if (color === 'black') {
        setTimeout(cpuMove, 1000);
      }
    }

    function newGame() {
      stopTimer();
      document.getElementById('lobbyOverlay').classList.remove('hidden');
      game = null;
      playerColor = null;
      whiteTime = 600;
      blackTime = 600;
      updateStatus('Choose game mode to start');
      updateMovesList();
    }

    function flipBoard() {
      const board = document.getElementById('chessBoard');
      board.style.transform = board.style.transform === 'rotate(180deg)' ? 'none' : 'rotate(180deg)';
    }

    function resign() {
      if (confirm('Are you sure you want to resign?')) {
        stopTimer();
        showVictory('Computer Wins! (Resignation)');
      }
    }

    function offerDraw() {
      if (confirm('Offer draw? Computer will accept.')) {
        stopTimer();
        showVictory('Draw! 🤝');
      }
    }

    function setDifficulty(level) {
      document.querySelectorAll('.difficulty-btn').forEach(btn => {
        btn.classList.remove('selected');
      });
      document.querySelector(`[data-level="${level}"]`).classList.add('selected');
      
      if (game) {
        game.difficulty = level;
      }
      
      document.getElementById('difficultySelect').value = level;
    }

    function changeBoardSize(size) {
      const wrapper = document.getElementById('boardWrapper');
      wrapper.className = wrapper.className.replace(/board-size-\w+/g, '');
      wrapper.classList.add('board-size-' + size);
      renderBoard();
    }

    function downloadPGN() {
      alert('PGN download coming soon!');
    }

    // Initialize
    updateStatus('Choose game mode to start');
  </script>
</body>
</html>
