<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master Pro - Working Version</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .game-modes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .difficulty {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .diff-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .diff-btn:hover {
            background: #38a169;
        }

        .diff-btn.active {
            background: #2d3748;
        }

        .game-area {
            display: none;
            text-align: center;
        }

        .game-area.active {
            display: block;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .white-avatar {
            background: white;
            border: 2px solid #333;
        }

        .black-avatar {
            background: #333;
            color: white;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: #edf2f7;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }

        .board {
            display: inline-block;
            margin: 0 auto;
            position: relative;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .control-btn:hover {
            background: #5a67d8;
        }

        .menu-btn {
            background: #e53e3e;
        }

        .menu-btn:hover {
            background: #c53030;
        }

        .chess-board {
            width: 400px;
            height: 400px;
            border: 2px solid #333;
            position: relative;
            background: #f0d9b5;
        }

        .square {
            width: 50px;
            height: 50px;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .square.light {
            background: #f0d9b5;
        }

        .square.dark {
            background: #b58863;
        }

        .square.selected {
            background: #f6f669 !important;
        }

        .square.valid-move {
            background: #aaffaa !important;
        }

        .square.valid-capture {
            background: #ffaaaa !important;
        }

        .piece {
            cursor: pointer;
            user-select: none;
        }

        .debug {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-width: 300px;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="debug" id="debug">Loading chess...</div>
        
        <div class="header">
            <h1 class="title">♟️ Chess Master Pro</h1>
            <p>Working chess game with simple rules</p>
        </div>

        <!-- Game Mode Selection -->
        <div id="modeSelection">
            <div class="game-modes">
                <button class="mode-btn" onclick="selectMode('ai')">🤖 Play vs Computer</button>
                <button class="mode-btn" onclick="selectMode('friend')">👥 Play vs Friend</button>
            </div>

            <div class="difficulty" id="difficulty">
                <button class="diff-btn active" onclick="setDifficulty('easy')">Easy</button>
                <button class="diff-btn" onclick="setDifficulty('medium')">Medium</button>
                <button class="diff-btn" onclick="setDifficulty('hard')">Hard</button>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area" id="gameArea">
            <div class="game-info">
                <div class="player">
                    <div class="player-avatar white-avatar">♔</div>
                    <div>
                        <div><strong>White</strong></div>
                        <div id="whiteStatus">Your turn</div>
                    </div>
                </div>
                <div class="player">
                    <div class="player-avatar black-avatar">♚</div>
                    <div>
                        <div><strong>Black</strong></div>
                        <div id="blackStatus">Computer</div>
                    </div>
                </div>
            </div>

            <div class="status" id="gameStatus">Game in progress</div>

            <div class="board">
                <div class="chess-board" id="board"></div>
            </div>

            <div class="controls">
                <button class="control-btn" onclick="undoMove()">↶ Undo</button>
                <button class="control-btn" onclick="resetGame()">🔄 Reset</button>
                <button class="control-btn menu-btn" onclick="backToMenu()">🏠 Menu</button>
            </div>
        </div>
    </div>

    <script>
        // Simple chess implementation
        let gameMode = null;
        let difficulty = 'easy';
        let playerColor = 'white';
        let currentTurn = 'white';
        let selectedSquare = null;
        let moveHistory = [];
        let gameBoard = [];

        // Chess pieces
        const pieces = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        function updateDebug(message) {
            document.getElementById('debug').innerHTML = message;
            console.log(message);
        }

        function updateStatus(message) {
            document.getElementById('gameStatus').textContent = message;
            updateDebug('Status: ' + message);
        }

        // Initialize board
        function initializeBoard() {
            // Starting position
            gameBoard = [
                ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
                ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
                [null, null, null, null, null, null, null, null],
                [null, null, null, null, null, null, null, null],
                [null, null, null, null, null, null, null, null],
                [null, null, null, null, null, null, null, null],
                ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
                ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
            ];
        }

        // Render board
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square';
                    square.className += (row + col) % 2 === 0 ? ' light' : ' dark';
                    square.style.left = col * 50 + 'px';
                    square.style.top = (7 - row) * 50 + 'px';
                    square.dataset.row = row;
                    square.dataset.col = col;

                    const piece = gameBoard[row][col];
                    if (piece) {
                        const pieceElement = document.createElement('span');
                        pieceElement.className = 'piece';
                        pieceElement.textContent = pieces[piece];
                        square.appendChild(pieceElement);
                    }

                    square.onclick = () => handleSquareClick(row, col);
                    boardElement.appendChild(square);
                }
            }
        }

        function handleSquareClick(row, col) {
            const piece = gameBoard[row][col];
            const pieceColor = piece ? (piece === piece.toUpperCase() ? 'white' : 'black') : null;

            updateDebug(`Clicked: ${row},${col}, Piece: ${piece}, Color: ${pieceColor}, Turn: ${currentTurn}`);

            if (selectedSquare === null) {
                // Select piece
                if (piece && pieceColor === currentTurn) {
                    selectedSquare = { row, col };
                    highlightSquare(row, col, 'selected');
                    showValidMoves(row, col);
                    updateStatus(`Selected ${pieceColor} ${piece}`);
                } else {
                    updateStatus('Not your turn or no piece selected!');
                }
            } else {
                // Move piece or select new piece
                if (row === selectedSquare.row && col === selectedSquare.col) {
                    // Deselect
                    clearHighlights();
                    selectedSquare = null;
                    updateStatus('Piece deselected');
                } else if (piece && pieceColor === currentTurn) {
                    // Select different piece
                    clearHighlights();
                    selectedSquare = { row, col };
                    highlightSquare(row, col, 'selected');
                    showValidMoves(row, col);
                    updateStatus(`Selected ${pieceColor} ${piece}`);
                } else if (isValidMove(selectedSquare.row, selectedSquare.col, row, col)) {
                    // Make move
                    makeMove(selectedSquare.row, selectedSquare.col, row, col);
                    clearHighlights();
                    selectedSquare = null;
                } else {
                    updateDebug(`Invalid move from ${selectedSquare.row},${selectedSquare.col} to ${row},${col}`);
                    updateStatus('Invalid move! Try a different square.');
                }
            }
        }

        function highlightSquare(row, col, className) {
            const squares = document.querySelectorAll('.square');
            squares[row * 8 + col].classList.add(className);
        }

        function showValidMoves(fromRow, fromCol) {
            let validMoveCount = 0;
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if (isValidMove(fromRow, fromCol, row, col)) {
                        const targetPiece = gameBoard[row][col];
                        if (targetPiece) {
                            highlightSquare(row, col, 'valid-capture');
                        } else {
                            highlightSquare(row, col, 'valid-move');
                        }
                        validMoveCount++;
                    }
                }
            }
            updateDebug(`Found ${validMoveCount} valid moves`);
        }

        function clearHighlights() {
            document.querySelectorAll('.square').forEach(square => {
                square.classList.remove('selected', 'valid-move', 'valid-capture');
            });
        }

        function isValidMove(fromRow, fromCol, toRow, toCol) {
            const piece = gameBoard[fromRow][fromCol];
            const targetPiece = gameBoard[toRow][toCol];

            if (!piece) {
                updateDebug('No piece at source');
                return false;
            }

            // Can't capture own piece
            if (targetPiece) {
                const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                const targetColor = targetPiece === targetPiece.toUpperCase() ? 'white' : 'black';
                if (pieceColor === targetColor) {
                    updateDebug('Cannot capture own piece');
                    return false;
                }
            }

            // Basic move validation
            const pieceType = piece.toLowerCase();
            const rowDiff = toRow - fromRow;
            const colDiff = toCol - fromCol;

            updateDebug(`Checking ${pieceType} move: rowDiff=${rowDiff}, colDiff=${colDiff}`);

            switch (pieceType) {
                case 'p': // Pawn
                    const direction = piece === 'P' ? 1 : -1;
                    const startRow = piece === 'P' ? 1 : 6;
                    
                    if (colDiff === 0 && !targetPiece) {
                        // Forward move
                        if (rowDiff === direction) {
                            updateDebug('Valid pawn forward move');
                            return true;
                        }
                        if (fromRow === startRow && rowDiff === 2 * direction && !gameBoard[fromRow + direction][fromCol]) {
                            updateDebug('Valid pawn double move');
                            return true;
                        }
                    } else if (Math.abs(colDiff) === 1 && Math.abs(rowDiff) === 1 && targetPiece) {
                        // Capture
                        if (rowDiff === direction) {
                            updateDebug('Valid pawn capture');
                            return true;
                        }
                    }
                    updateDebug('Invalid pawn move');
                    return false;

                case 'n': // Knight
                    const isValidKnight = (Math.abs(rowDiff) === 2 && Math.abs(colDiff) === 1) || (Math.abs(rowDiff) === 1 && Math.abs(colDiff) === 2);
                    updateDebug(`Knight move valid: ${isValidKnight}`);
                    return isValidKnight;

                case 'r': // Rook
                    if (rowDiff === 0 || colDiff === 0) {
                        const isClear = isPathClear(fromRow, fromCol, toRow, toCol);
                        updateDebug(`Rook move, path clear: ${isClear}`);
                        return isClear;
                    }
                    updateDebug('Invalid rook move');
                    return false;

                case 'b': // Bishop
                    if (Math.abs(rowDiff) === Math.abs(colDiff)) {
                        const isClear = isPathClear(fromRow, fromCol, toRow, toCol);
                        updateDebug(`Bishop move, path clear: ${isClear}`);
                        return isClear;
                    }
                    updateDebug('Invalid bishop move');
                    return false;

                case 'q': // Queen
                    if (rowDiff === 0 || colDiff === 0 || Math.abs(rowDiff) === Math.abs(colDiff)) {
                        const isClear = isPathClear(fromRow, fromCol, toRow, toCol);
                        updateDebug(`Queen move, path clear: ${isClear}`);
                        return isClear;
                    }
                    updateDebug('Invalid queen move');
                    return false;

                case 'k': // King
                    const isValidKing = Math.abs(rowDiff) <= 1 && Math.abs(colDiff) <= 1;
                    updateDebug(`King move valid: ${isValidKing}`);
                    return isValidKing;

                default:
                    updateDebug('Unknown piece type');
                    return false;
            }
        }

        function isPathClear(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
            const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;
            
            let row = fromRow + rowStep;
            let col = fromCol + colStep;
            
            while (row !== toRow || col !== toCol) {
                if (gameBoard[row][col]) {
                    updateDebug(`Path blocked at ${row},${col}`);
                    return false;
                }
                row += rowStep;
                col += colStep;
            }
            
            updateDebug('Path is clear');
            return true;
        }

        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = gameBoard[fromRow][fromCol];
            const targetPiece = gameBoard[toRow][toCol];
            
            updateDebug(`Making move: ${piece} from ${fromRow},${fromCol} to ${toRow},${toCol}`);
            
            gameBoard[toRow][toCol] = piece;
            gameBoard[fromRow][fromCol] = null;
            
            moveHistory.push({ from: { row: fromRow, col: fromCol }, to: { row: toRow, col: toCol }, piece, captured: targetPiece });
            
            const moveNotation = getMoveNotation(piece, fromRow, fromCol, toRow, toCol, targetPiece);
            updateStatus(`Move played: ${moveNotation}`);
            
            // Switch turns
            currentTurn = currentTurn === 'white' ? 'black' : 'white';
            updateTurnStatus();
            
            renderBoard();
            
            // AI move
            if (gameMode === 'ai' && currentTurn === 'black') {
                updateStatus('Computer is thinking...');
                setTimeout(makeAIMove, 1000);
            }
        }

        function getMoveNotation(piece, fromRow, fromCol, toRow, toCol, captured) {
            const files = 'abcdefgh';
            const pieceSymbol = piece.toLowerCase() === 'p' ? '' : piece.toUpperCase();
            const capture = captured ? 'x' : '';
            return `${pieceSymbol}${files[fromCol]}${8 - fromRow}${capture}${files[toCol]}${8 - toRow}`;
        }

        function makeAIMove() {
            const moves = getAllValidMoves('black');
            updateDebug(`AI has ${moves.length} valid moves`);
            
            if (moves.length === 0) {
                updateStatus('No moves available for computer');
                return;
            }

            // Simple AI: random move
            const move = moves[Math.floor(Math.random() * moves.length)];
            updateDebug(`AI chose move: ${move.from.row},${move.from.col} to ${move.to.row},${move.to.col}`);
            makeMove(move.from.row, move.from.col, move.to.row, move.to.col);
            updateStatus(`Computer played: ${getMoveNotation(gameBoard[move.to.row][move.to.col], move.from.row, move.from.col, move.to.row, move.to.col, move.captured)}`);
        }

        function getAllValidMoves(color) {
            const moves = [];
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = gameBoard[row][col];
                    if (piece) {
                        const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
                        if (pieceColor === color) {
                            for (let toRow = 0; toRow < 8; toRow++) {
                                for (let toCol = 0; toCol < 8; toCol++) {
                                    if (isValidMove(row, col, toRow, toCol)) {
                                        moves.push({ from: { row, col }, to: { row: toRow, col: toCol } });
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return moves;
        }

        function updateTurnStatus() {
            if (gameMode === 'ai') {
                if (currentTurn === 'white') {
                    document.getElementById('whiteStatus').textContent = 'Your turn';
                    document.getElementById('blackStatus').textContent = 'Computer';
                } else {
                    document.getElementById('whiteStatus').textContent = 'You';
                    document.getElementById('blackStatus').textContent = 'Computer\'s turn';
                }
            } else {
                if (currentTurn === 'white') {
                    document.getElementById('whiteStatus').textContent = 'Player 1\'s turn';
                    document.getElementById('blackStatus').textContent = 'Player 2';
                } else {
                    document.getElementById('whiteStatus').textContent = 'Player 1';
                    document.getElementById('blackStatus').textContent = 'Player 2\'s turn';
                }
            }
        }

        function selectMode(mode) {
            gameMode = mode;
            updateDebug('Selected mode: ' + mode);

            if (mode === 'ai') {
                document.getElementById('difficulty').style.display = 'flex';
                updateStatus('Select difficulty level');
            } else {
                document.getElementById('difficulty').style.display = 'none';
                startGame('friend');
            }
        }

        function setDifficulty(level) {
            difficulty = level;
            updateDebug('Difficulty set to: ' + level);
            
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            startGame('ai');
        }

        function startGame(mode) {
            updateDebug('Starting game: ' + mode);
            
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('gameArea').classList.add('active');

            playerColor = 'white';
            currentTurn = 'white';
            selectedSquare = null;
            moveHistory = [];

            if (mode === 'ai') {
                document.getElementById('whiteStatus').textContent = 'Your turn';
                document.getElementById('blackStatus').textContent = 'Computer';
            } else {
                document.getElementById('whiteStatus').textContent = 'Player 1\'s turn';
                document.getElementById('blackStatus').textContent = 'Player 2';
            }

            initializeBoard();
            renderBoard();
            updateStatus('Game started! Click a white piece to move');
        }

        function undoMove() {
            if (moveHistory.length >= 2) {
                // Undo last two moves (player + AI)
                const lastMove = moveHistory.pop();
                const secondLastMove = moveHistory.pop();
                
                gameBoard[secondLastMove.from.row][secondLastMove.from.col] = secondLastMove.piece;
                gameBoard[lastMove.from.row][lastMove.from.col] = lastMove.piece;
                gameBoard[secondLastMove.to.row][secondLastMove.to.col] = secondLastMove.captured || null;
                gameBoard[lastMove.to.row][lastMove.to.col] = lastMove.captured || null;
                
                currentTurn = 'white';
                updateTurnStatus();
                renderBoard();
                updateStatus('Move undone');
            }
        }

        function resetGame() {
            initializeBoard();
            renderBoard();
            currentTurn = 'white';
            selectedSquare = null;
            moveHistory = [];
            updateTurnStatus();
            updateStatus('Game reset');
        }

        function backToMenu() {
            document.getElementById('modeSelection').style.display = 'block';
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('difficulty').style.display = 'none';
            resetGame();
            updateStatus('Choose a game mode to start');
        }

        // Initialize
        window.onload = function() {
            updateDebug('Chess loaded and ready!');
            updateStatus('Choose a game mode to start');
        };
    </script>
</body>
</html>
