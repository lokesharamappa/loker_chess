<!DOCTYPE html>
<html>
<head>
    <title>World-Class Chess App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://chessboardjs.com/css/chessboard.css">
    <script src="https://chessboardjs.com/js/chessboard.js"></script>
    <script src="https://chessboardjs.com/js/chess.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 30px;
        }

        .title {
            font-size: 42px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .control-btn.primary {
            background: #48bb78;
        }

        .control-btn.primary:hover {
            background: #38a169;
        }

        .control-btn.secondary {
            background: #ed8936;
        }

        .control-btn.secondary:hover {
            background: #dd6b20;
        }

        .control-btn.danger {
            background: #e53e3e;
        }

        .control-btn.danger:hover {
            background: #c53030;
        }

        .game-area {
            display: none;
        }

        .game-area.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            width: 100%;
            max-width: 700px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        .white-avatar {
            background: white;
            border: 4px solid #333;
            color: #333;
        }

        .black-avatar {
            background: #333;
            color: white;
        }

        .player-details {
            text-align: left;
        }

        .player-name {
            font-weight: 700;
            color: #333;
            font-size: 18px;
        }

        .player-status {
            color: #666;
            font-size: 16px;
            margin-top: 5px;
        }

        .game-status {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            max-width: 700px;
        }

        .board-container {
            margin-bottom: 40px;
        }

        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 700px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }

        .info-label {
            font-weight: 700;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .info-value {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            background: white;
            padding: 8px;
            border-radius: 4px;
        }

        .move-history {
            max-height: 200px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            width: 100%;
            max-width: 700px;
        }

        .move-item {
            padding: 5px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .move-item:last-child {
            border-bottom: none;
        }

        .test-status {
            background: #fef3cd;
            border: 2px solid #f0ad4e;
            color: #92400e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .test-status.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .test-status.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">World-Class Chess Master Pro</h1>
            <p class="subtitle">Professional Chess Engine with SDD & TDD Integration</p>
        </header>

        <div class="test-status" id="testStatus">
            Testing in Progress...
        </div>

        <div class="game-controls" id="gameControls">
            <button class="control-btn primary" onclick="startNewGame()">🎮 Start Game</button>
            <button class="control-btn secondary" onclick="setDifficulty('easy')">🟢 Easy</button>
            <button class="control-btn secondary" onclick="setDifficulty('medium')">🟡 Medium</button>
            <button class="control-btn secondary" onclick="setDifficulty('hard')">🔴 Hard</button>
            <button class="control-btn" onclick="flipBoard()">🔄 Flip Board</button>
            <button class="control-btn" onclick="undoMove()">↶ Undo</button>
            <button class="control-btn danger" onclick="resetGame()">🔄 Reset</button>
        </div>

        <div class="game-area" id="gameArea">
            <div class="game-header">
                <div class="player-info">
                    <div class="player-avatar white-avatar">♔</div>
                    <div class="player-details">
                        <div class="player-name">White</div>
                        <div class="player-status" id="whiteStatus">Your turn</div>
                    </div>
                </div>
                <div class="player-info">
                    <div class="player-avatar black-avatar">♚</div>
                    <div class="player-details">
                        <div class="player-name">Black</div>
                        <div class="player-status" id="blackStatus">Computer</div>
                    </div>
                </div>
            </div>

            <div class="game-status" id="status">Click "Start Game" to begin</div>

            <div class="board-container">
                <div id="myBoard" style="width: 500px;"></div>
            </div>

            <div class="info-panel">
                <div class="info-box">
                    <div class="info-label">Game State</div>
                    <div class="info-value" id="gameState">Not Started</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Move Count</div>
                    <div class="info-value" id="moveCount">0</div>
                </div>
            </div>

            <div class="move-history">
                <div style="font-weight: bold; margin-bottom: 10px;">Move History</div>
                <div id="pgn">No moves yet</div>
            </div>
        </div>
    </div>

    <script>
        // World-Class Chess Engine - Built with Lessons Learned
        // Using proven chessboardjs and chess.js libraries
        // Testing-driven development approach
        
        console.log('World-Class Chess App Loading...');
        
        // Test status update function
        function updateTestStatus(message, type = 'info') {
            const statusEl = document.getElementById('testStatus');
            statusEl.textContent = message;
            statusEl.className = 'test-status';
            if (type === 'success') {
                statusEl.classList.add('success');
            } else if (type === 'error') {
                statusEl.classList.add('error');
            }
            console.log('TEST:', message);
        }

        // Test function
        function testComponent(name, testFn) {
            try {
                const result = testFn();
                if (result) {
                    updateTestStatus(`✓ ${name} - Working`, 'success');
                    return true;
                } else {
                    updateTestStatus(`❌ ${name} - Failed`, 'error');
                    return false;
                }
            } catch (error) {
                updateTestStatus(`❌ ${name} - Error: ${error.message}`, 'error');
                return false;
            }
        }

        // Test all components before starting
        function runTests() {
            updateTestStatus('Running Tests...', 'info');
            
            // Wait for libraries to load
            setTimeout(() => {
                let allPassed = true;
                
                // Test 1: HTML Structure
                try {
                    const container = document.querySelector('.container');
                    const board = document.getElementById('myBoard');
                    const status = document.getElementById('status');
                    if (container && board && status) {
                        updateTestStatus('✅ HTML Structure - Working', 'success');
                    } else {
                        updateTestStatus('❌ HTML Structure - Missing elements', 'error');
                        allPassed = false;
                    }
                } catch (error) {
                    updateTestStatus(`❌ HTML Structure - Error: ${error.message}`, 'error');
                    allPassed = false;
                }
                
                // Test 2: jQuery Loading
                try {
                    if (typeof $ !== 'undefined') {
                        updateTestStatus('✅ jQuery Loading - Working', 'success');
                    } else {
                        updateTestStatus('❌ jQuery Loading - Not loaded', 'error');
                        allPassed = false;
                    }
                } catch (error) {
                    updateTestStatus(`❌ jQuery Loading - Error: ${error.message}`, 'error');
                    allPassed = false;
                }
                
                // Test 3: Chessboard.js Loading
                try {
                    if (typeof Chessboard !== 'undefined') {
                        updateTestStatus('✅ Chessboard.js Loading - Working', 'success');
                    } else {
                        updateTestStatus('❌ Chessboard.js Loading - Not loaded', 'error');
                        allPassed = false;
                    }
                } catch (error) {
                    updateTestStatus(`❌ Chessboard.js Loading - Error: ${error.message}`, 'error');
                    allPassed = false;
                }
                
                // Test 4: Chess.js Loading
                try {
                    if (typeof Chess !== 'undefined') {
                        updateTestStatus('✅ Chess.js Loading - Working', 'success');
                    } else {
                        updateTestStatus('❌ Chess.js Loading - Not loaded', 'error');
                        allPassed = false;
                    }
                } catch (error) {
                    updateTestStatus(`❌ Chess.js Loading - Error: ${error.message}`, 'error');
                    allPassed = false;
                }

                if (allPassed) {
                    updateTestStatus('✅ All Tests Passed - Ready to Play!', 'success');
                    setTimeout(initializeGame, 1000);
                } else {
                    updateTestStatus('❌ Tests Failed - Check console for details', 'error');
                    console.log('Debug: Checking window object for libraries...');
                    console.log('jQuery:', typeof $);
                    console.log('Chessboard:', typeof Chessboard);
                    console.log('Chess:', typeof Chess);
                }
            }, 3000); // Wait 3 seconds for libraries to load
        }

        // Chess Engine Variables
        var board = null;
        var game = null;
        var gameMode = 'ai';
        var difficulty = 'easy';
        var moveCount = 0;

        // Chess Engine Functions
        function initializeGame() {
            updateTestStatus('Initializing Chess Engine...', 'info');
            
            try {
                // Test if chess.js is available
                if (typeof Chess === 'undefined') {
                    throw new Error('Chess.js library not loaded');
                }
                
                // Test if chessboard.js is available
                if (typeof Chessboard === 'undefined') {
                    throw new Error('Chessboard.js library not loaded');
                }
                
                // Create chess game
                game = new Chess();
                updateTestStatus('✅ Chess Engine Created', 'success');
                
                // Create chessboard
                board = Chessboard('myBoard', {
                    draggable: true,
                    position: 'start',
                    onDragStart: onDragStart,
                    onDrop: onDrop,
                    onSnapEnd: onSnapEnd
                });
                
                updateTestStatus('✅ Chess Board Created', 'success');
                
                updateGameInfo();
                updateTestStatus('✅ Chess Engine Initialized', 'success');
                
                return true;
            } catch (error) {
                updateTestStatus(`❌ Chess Engine Failed: ${error.message}`, 'error');
                return false;
            }
        }

        function updateGameInfo() {
            const gameState = game.game_over() ? 'Game Over' : game.turn() === 'w' ? 'White\'s Turn' : 'Black\'s Turn';
            document.getElementById('gameState').textContent = gameState;
            document.getElementById('moveCount').textContent = moveCount;
        }

        // Chess Game Logic
        function onDragStart(source, piece, position, orientation) {
            if (!game || game.game_over()) return false;
            
            // Only allow dragging current player's pieces
            if (gameMode === 'ai') {
                if (game.turn() === 'w' && piece.search(/^b/) !== -1) return false;
                if (game.turn() === 'b' && piece.search(/^w/) !== -1) return false;
            }
            
            return true;
        }

        function onDrop(source, target) {
            if (!game || game.game_over()) return 'snapback';
            
            try {
                const move = game.move({
                    from: source,
                    to: target,
                    promotion: 'q'
                });

                if (move === null) {
                    updateTestStatus('❌ Invalid Move - Snapback', 'error');
                    return 'snapback';
                }

                moveCount++;
                updateGameInfo();
                updateStatus();
                updateMoveHistory();
                
                updateTestStatus(`✅ Move Executed: ${move.san}`, 'success');
                
                // AI Move
                if (gameMode === 'ai' && game.turn() === 'b' && !game.game_over()) {
                    setTimeout(makeAIMove, 1000);
                }
                
                return true;
            } catch (error) {
                updateTestStatus(`❌ Move Error: ${error.message}`, 'error');
                return 'snapback';
            }
        }

        function onSnapEnd() {
            if (board && game) {
                board.position(game.fen());
            }
        }

        function updateStatus() {
            if (!game) return;
            
            let status = '';
            const moveColor = game.turn() === 'w' ? 'White' : 'Black';
            
            if (game.in_checkmate()) {
                status = `Checkmate! ${moveColor} wins!`;
            } else if (game.in_draw()) {
                status = 'Game Over - Draw';
            } else if (game.in_check()) {
                status = `${moveColor} to move - Check!`;
            } else {
                status = `${moveColor} to move`;
            }
            
            document.getElementById('status').textContent = status;
            
            // Update player status
            if (game.turn() === 'w') {
                document.getElementById('whiteStatus').textContent = 'Your turn';
                document.getElementById('blackStatus').textContent = 'Computer';
            } else {
                document.getElementById('whiteStatus').textContent = 'You';
                document.getElementById('blackStatus').textContent = 'Computer\'s turn';
            }
        }

        function updateMoveHistory() {
            if (!game) return;
            document.getElementById('pgn').textContent = game.pgn();
        }

        // AI Functions
        function makeAIMove() {
            if (!game || game.game_over()) return;
            
            try {
                const moves = game.moves();
                
                if (moves.length === 0) return;
                
                let selectedMove;
                
                // Different AI strategies based on difficulty
                if (difficulty === 'easy') {
                    // Random move
                    selectedMove = moves[Math.floor(Math.random() * moves.length)];
                } else if (difficulty === 'medium') {
                    // Prefer captures and checks
                    const captures = moves.filter(move => game.get(move.to).piece);
                    const checks = moves.filter(move => {
                        game.move(move);
                        const inCheck = game.in_check();
                        game.undo();
                        return inCheck;
                    });
                    
                    if (checks.length > 0) {
                        selectedMove = checks[Math.floor(Math.random() * checks.length)];
                    } else if (captures.length > 0) {
                        selectedMove = captures[Math.floor(Math.random() * captures.length)];
                    } else {
                        selectedMove = moves[Math.floor(Math.random() * moves.length)];
                    }
                } else if (difficulty === 'hard') {
                    // Simple evaluation
                    selectedMove = moves.reduce((best, move) => {
                        const score = evaluateMove(move);
                        return score > best.score ? { move, score } : best;
                    }, { move: moves[0], score: 0 }).move;
                }
                
                const move = game.move(selectedMove);
                moveCount++;
                updateGameInfo();
                updateStatus();
                updateMoveHistory();
                board.position(game.fen());
                
                updateTestStatus(`✅ AI Move: ${move.san}`, 'success');
                
            } catch (error) {
                updateTestStatus(`❌ AI Error: ${error.message}`, 'error');
            }
        }

        function evaluateMove(move) {
            let score = 0;
            
            // Capture value
            if (game.get(move.to).piece) {
                const pieceValues = { 'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 0 };
                score += pieceValues[game.get(move.to).piece.toLowerCase()] || 0;
            }
            
            // Center control
            const centerSquares = ['d4', 'e4', 'd5', 'e5'];
            if (centerSquares.includes(move.to)) {
                score += 0.5;
            }
            
            // Random factor for variety
            score += Math.random() * 0.3;
            
            return score;
        }

        // Game Control Functions
        function startNewGame() {
            updateTestStatus('Starting New Game...', 'info');
            
            try {
                if (!game) {
                    if (!initializeGame()) {
                        return;
                    }
                }
                
                game.reset();
                moveCount = 0;
                gameMode = 'ai';
                updateGameInfo();
                updateStatus();
                updateMoveHistory();
                board.position('start');
                
                document.getElementById('gameArea').classList.add('active');
                document.getElementById('gameControls').style.display = 'none';
                
                updateTestStatus('✅ Game Started Successfully', 'success');
                
            } catch (error) {
                updateTestStatus(`❌ Start Game Failed: ${error.message}`, 'error');
            }
        }

        function setDifficulty(level) {
            difficulty = level;
            
            // Update button states
            document.querySelectorAll('.control-btn.secondary').forEach(btn => {
                btn.classList.remove('primary');
            });
            event.target.classList.add('primary');
            
            updateTestStatus(`Difficulty set to: ${level}`, 'info');
        }

        function flipBoard() {
            if (board) {
                board.flip();
                updateTestStatus('Board flipped', 'info');
            }
        }

        function undoMove() {
            if (!game) return;
            
            try {
                if (moveCount >= 2) {
                    game.undo();
                    game.undo();
                    moveCount -= 2;
                    updateGameInfo();
                    updateStatus();
                    updateMoveHistory();
                    board.position(game.fen());
                    
                    updateTestStatus('Move undone', 'info');
                } else {
                    updateTestStatus('No moves to undo', 'info');
                }
            } catch (error) {
                updateTestStatus(`❌ Undo Failed: ${error.message}`, 'error');
            }
        }

        function resetGame() {
            if (!game) return;
            
            try {
                game.reset();
                moveCount = 0;
                updateGameInfo();
                updateStatus();
                updateMoveHistory();
                board.position('start');
                
                updateTestStatus('Game reset', 'info');
            } catch (error) {
                updateTestStatus(`❌ Reset Failed: ${error.message}`, 'error');
            }
        }

        // Initialize and Test
        window.onload = function() {
            updateTestStatus('Loading World-Class Chess App...', 'info');
            setTimeout(runTests, 500);
        };
    </script>
</body>
</html>
