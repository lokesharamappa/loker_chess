<!DOCTYPE html>
<html>
<head>
    <title>Simple Chess</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            gap: 1px;
            border: 2px solid #333;
            margin: 20px auto;
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
        }
        .square:nth-child(even) {
            background: #f0d9b5;
        }
        .square:nth-child(odd) {
            background: #b58863;
        }
        .square.selected {
            background: #ffff00 !important;
        }
        .status {
            text-align: center;
            margin: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Simple Chess - Test</h1>
    <div class="status" id="status">Click a white pawn to test</div>
    <div class="board" id="board"></div>

    <script>
        // Simple chess board
        const board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        const pieces = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square';
                    square.dataset.row = row;
                    square.dataset.col = col;
                    
                    const piece = board[row][col];
                    if (piece) {
                        square.textContent = pieces[piece];
                        square.onclick = () => handleClick(row, col);
                    }
                    
                    boardElement.appendChild(square);
                }
            }
        }

        function handleClick(row, col) {
            const piece = board[row][col];
            document.getElementById('status').textContent = `Clicked piece: ${piece} at row ${row}, col ${col}`;
            
            // Simple test: just show what was clicked
            console.log('Clicked:', piece, 'at', row, col);
        }

        // Initialize
        renderBoard();
        document.getElementById('status').textContent = 'Board loaded! Click any piece to test.';
    </script>
</body>
</html>
